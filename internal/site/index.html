<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="description" content="On-chain analytics for tokenized real estate on Binaryx: sales, holders, secondary market activity, and posted rent.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Binaryx Lens">
  <meta property="og:description" content="On-chain analytics for tokenized real estate on Binaryx.">
  <meta property="og:image" content="https://binaryxlens.pages.dev/logo-social.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://binaryxlens.pages.dev/logo-social.svg">
  <link rel="stylesheet" href="internal/site/site.css">
  <title>Binaryx Lens</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="1c14ba43-3bbe-48a2-a65b-b4e12f91d3b4"></script>
</head>
<body>
  <main>
    __COMMON_HEADER__
    <div class="tools">
      <label class="search">
        <span data-i18n="search.title">Search</span>
        <input id="project-search" type="search" placeholder="Project or property" autocomplete="off">
      </label>
      <div class="filters">
        <div id="state-filters" role="group" data-i18n-aria="index.state">
          <button type="button" data-state-filter="all" data-i18n="index.all" aria-pressed="true">All</button>
          <button type="button" data-state-filter="rental" data-i18n="state.rental" aria-pressed="false">rental</button>
          <button type="button" data-state-filter="construction" data-i18n="state.construction" aria-pressed="false">construction</button>
          <button type="button" data-state-filter="redeemed" data-i18n="state.redeemed" aria-pressed="false">redeemed</button>
        </div>
        <p id="project-count" aria-live="polite"></p>
      </div>
    </div>
    <p id="project-empty" class="empty" hidden data-i18n="index.empty">No projects match. Clear the search or choose All.</p>
    <nav>__INDEX_NAV__</nav>
    <p class="report-problem"><a href="https://github.com/aint/binaryxlens/issues" data-i18n="footer.reportProblem">Report a problem</a></p>
  </main>
  <script>__I18N_SCRIPT__</script>
  <script src="internal/site/navigation.js"></script>
  <script>
    (function () {
      const search = document.getElementById("project-search");
      const filters = document.getElementById("state-filters");
      const list = document.querySelector("nav");
      const rows = Array.from(list.querySelectorAll("a"));
      const countEl = document.getElementById("project-count");
      const empty = document.getElementById("project-empty");
      const t = window.i18n.t;

      search.placeholder = t("search.indexPlaceholder");

      function apply() {
        const query = search.value.trim().toLowerCase();
        const pressed = filters.querySelector('[aria-pressed="true"]');
        const type = pressed ? pressed.dataset.stateFilter : "all";
        let shown = 0;
        let last = null;
        rows.forEach(function (row) {
          const name = row.querySelector(".name");
          const props = row.querySelector(".props");
          const text = ((name ? name.textContent : "") + " " + (props ? props.textContent : "")).toLowerCase();
          const typeOk = type === "all" || row.querySelector(".tag-" + type);
          const match = text.indexOf(query) !== -1 && typeOk;
          row.hidden = !match;
          row.classList.remove("is-last");
          if (match) {
            shown += 1;
            last = row;
          }
        });
        if (last) last.classList.add("is-last");
        list.hidden = shown === 0;
        empty.hidden = shown !== 0;
        countEl.textContent = t("index.projects", { n: shown });
      }

      search.addEventListener("input", apply);
      filters.addEventListener("click", function (event) {
        const button = event.target.closest("[data-state-filter]");
        if (!button) return;
        filters.querySelectorAll("[data-state-filter]").forEach(function (el) {
          el.setAttribute("aria-pressed", String(el === button));
        });
        apply();
      });
      apply();
    })();
  </script>
</body>
</html>
