<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trends - Binaryx Lens</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="1c14ba43-3bbe-48a2-a65b-b4e12f91d3b4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
      padding: 32px 16px 48px;
      line-height: 1.5;
    }
    main { max-width: 45rem; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em; margin: 0; flex: 1; min-width: 0; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .github-links { display: flex; align-items: center; gap: 6px; }
    .github-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      color: #444;
      text-decoration: none;
    }
    .github-links a:hover { background: #e8e8e8; color: #1a1a1a; }
    .github-links a:focus-visible { outline: 2px solid #0b57d0; outline-offset: 2px; }
    .github-links svg { display: block; width: 18px; height: 18px; }
    .lang-switch { display: flex; gap: 2px; flex-shrink: 0; }
    .lang-switch button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #444;
      cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .lede { color: #444; margin: 0 0 16px; font-size: 0.95rem; }
    .lede a, .report-problem a, td.properties a { color: #0b57d0; }
    .updated {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      font-size: 0.8rem;
      color: #555;
    }
    .updated time {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      color: #1a1a1a;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 999px;
      padding: 2px 10px;
    }
    .navigation { display: flex; gap: 4px; margin: 0 0 16px; }
    .navigation button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #444;
      cursor: pointer;
    }
    .navigation button[aria-selected="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .navigation button:focus-visible { outline: 2px solid #0b57d0; outline-offset: 2px; }
    .tools { display: flex; flex-direction: column; gap: 12px; margin: 0 0 16px; }
    .tools-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 0 16px; }
    .tools-row .search { flex: 1; max-width: 24rem; }
    .report-problem { margin: 16px 0 0; font-size: 0.85rem; }
    .search { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: 600; }
    .search input {
      font: inherit;
      font-size: 0.95rem;
      font-weight: 400;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: inherit;
    }
    .search input:focus-visible, #state-filters button:focus-visible {
      outline: 2px solid #0b57d0;
      outline-offset: 2px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
    }
    #state-filters { display: flex; flex-wrap: wrap; gap: 4px; }
    #state-filters button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #444;
      cursor: pointer;
    }
    #state-filters button[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    #project-count, #holder-count { margin: 0; font-size: 0.85rem; color: #555; font-variant-numeric: tabular-nums; }
    .empty {
      margin: 0;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      color: #444;
    }
    nav {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      color: #1a1a1a;
      text-decoration: none;
      border-bottom: 1px solid #eee;
    }
    nav a[hidden], nav[hidden] { display: none; }
    nav a:last-child, nav a.is-last { border-bottom: none; }
    nav a:hover { background: #f7f8fa; }
    .trend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid #eee;
    }
    .trend-row:last-child { border-bottom: none; }
    .trends-note { margin: 0 0 8px; font-size: 0.8rem; color: #555; }
    .trend-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      background: #f7f8fa;
      border-bottom: 1px solid #e0e0e0;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #555;
    }
    .delta {
      font-size: 0.9rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .delta.up { color: #1d6b3a; }
    .delta.down { color: #b42318; }
    .delta.flat { color: #555; }
    .item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .name { font-weight: 550; }
    .props { color: #555; font-size: 0.8rem; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .tag-construction { background: #f4efe4; color: #7a5b2e; }
    .tag-rental { background: #e7f2ea; color: #1d6b3a; }
    .tag-redeemed { background: #e8eef6; color: #1e4a7a; }
    .tags { align-items: center; }
    .rating {
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .rating-high { background: #e7f2ea; color: #1d6b3a; }
    .rating-mid { background: #fff4d6; color: #8a5a00; }
    .rating-low { background: #fde8e8; color: #b42318; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Binaryx Lens</h1>
      <div class="header-actions">
        <div class="github-links">
          <a href="https://github.com/aint/binaryxlens" target="_blank" rel="noopener noreferrer" aria-label="Star on GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.756 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
          </a>
          <a href="https://github.com/aint/binaryxlens#binaryx-lens" target="_blank" rel="noopener noreferrer" aria-label="Source code">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.18.82a7.49 7.49 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.51-1.04 2.18-.82 2.18-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.06-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          </a>
        </div>
        <div id="lang-switch" class="lang-switch"></div>
      </div>
    </header>
    <p class="updated"><span data-i18n="header.updated">Updated</span> <time id="reports-updated">__UPDATED__ UTC</time></p>
    <p class="lede">
      <span data-i18n="header.lede">Blockchain data analysis for tokenized properties on</span>
      <a href="https://binaryx.com">binaryx.com</a>.
    </p>
    <div class="navigation" role="tablist">
      <button type="button" id="show-projects" role="tab" aria-selected="false"  data-i18n="header.projectsButton">Projects</button>
      <button type="button" id="show-holders"  role="tab" aria-selected="false"  data-i18n="header.holdersButton">Holders</button>
      <button type="button" id="show-trends"   role="tab" aria-selected="true"   data-i18n="header.trendsButton">Trends</button>
    </div>
    <p class="trends-note" data-i18n="trends.monthDeltaNote">USDT change over the last 30 days.</p>
    <nav>
      <div class="trend-head">
        <span data-i18n="trends.type">Type</span>
        <span data-i18n="trends.monthDelta">Month Δ</span>
      </div>
      __TRENDS__
    </nav>
    <p class="report-problem"><a href="https://github.com/aint/binaryxlens/issues" data-i18n="footer.reportProblem">Report a problem</a></p>
  </main>
  <script>__I18N_SCRIPT__</script>
  <script>
    (function () {
      document.getElementById('show-projects').addEventListener('click', function () {
        window.location.href = 'index.html';
      });
      document.getElementById('show-holders').addEventListener('click', function () {
        window.location.href = 'holders.html';
      });
      document.getElementById('show-trends').addEventListener('click', function () {
        window.location.href = 'trends.html';
      });
    })();
  </script>
</body>
</html>
