<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holders — Binaryx Lens</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="1c14ba43-3bbe-48a2-a65b-b4e12f91d3b4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
      padding: 32px 16px 48px;
      line-height: 1.5;
    }
    main { max-width: 45rem; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em; margin: 0; flex: 1; min-width: 0; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .github-links { display: flex; align-items: center; gap: 6px; }
    .github-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      color: #444;
      text-decoration: none;
    }
    .github-links a:hover { background: #e8e8e8; color: #1a1a1a; }
    .github-links a:focus-visible { outline: 2px solid #0b57d0; outline-offset: 2px; }
    .github-links svg { display: block; width: 18px; height: 18px; }
    .lang-switch { display: flex; gap: 2px; flex-shrink: 0; }
    .lang-switch button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #444;
      cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .lede { color: #444; margin: 0 0 16px; font-size: 0.95rem; }
    .lede a, .report-problem a, td.properties a { color: #0b57d0; }
    .updated {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      font-size: 0.8rem;
      color: #555;
    }
    .updated time {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      color: #1a1a1a;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 999px;
      padding: 2px 10px;
    }
    .navigation { display: flex; gap: 4px; margin: 0 0 16px; }
    .navigation button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #444;
      cursor: pointer;
    }
    .navigation button[aria-selected="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .navigation button:focus-visible { outline: 2px solid #0b57d0; outline-offset: 2px; }
    .tools { display: flex; flex-direction: column; gap: 12px; margin: 0 0 16px; }
    .tools-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 0 16px; }
    .tools-row .search { flex: 1; max-width: 24rem; }
    .report-problem { margin: 16px 0 0; font-size: 0.85rem; }
    /* here */
    .search { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: 600; }
    .search input {
      font: inherit;
      font-size: 0.95rem;
      font-weight: 400;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: inherit;
    }
    .search input:focus-visible, #state-filters button:focus-visible {
      outline: 2px solid #0b57d0;
      outline-offset: 2px;
    }
    #holder-count { margin: 0; font-size: 0.85rem; color: #555; font-variant-numeric: tabular-nums; }
    .holders-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .holders-limit {
      display: inline-flex;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      overflow: hidden;
    }
    .holders-limit button {
      border: 0;
      background: #fff;
      padding: 3px 10px;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      text-transform: capitalize;
    }
    .holders-limit button + button { border-left: 1px solid #d1d5db; }
    .holders-limit button[aria-pressed="true"] { background: #1f2937; color: #fff; }
    .empty {
      margin: 0;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      color: #444;
    }
    .holders-scroll { overflow-x: auto; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; }
    table { border-collapse: collapse; font-size: 0.8rem; width: 100%; }
    th, td { border-bottom: 1px solid #eee; padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: #f7f8fa; white-space: nowrap; font-size: 0.72rem; }
    tr:last-child td { border-bottom: none; }
    tr[hidden] { display: none; }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    td.address { font-family: ui-monospace, monospace; font-size: 0.75rem; white-space: nowrap; }
    tr.is-target td { background: #eef4ff; }
    td.properties { min-width: 180px; }
    td.properties a { display: block; color: #0b57d0; text-decoration: none; }
    td.properties a:hover { text-decoration: underline; }
    td.trend.up { color: #1a7f37; }
    td.trend.down { color: #cf222e; }
    td.trend.flat { color: #888; }
    .off-platform-note { color: #666; font-size: 0.8rem; margin: 8px 0 0; }
    .extra-properties[hidden] { display: none; }
    .toggle-properties { display: block; margin-top: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Binaryx Lens</h1>
      <div class="header-actions">
        <div class="github-links">
          <a href="https://github.com/aint/binaryxlens" target="_blank" rel="noopener noreferrer" aria-label="Star on GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.756 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
          </a>
          <a href="https://github.com/aint/binaryxlens#binaryx-lens" target="_blank" rel="noopener noreferrer" aria-label="Source code">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.18.82a7.49 7.49 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.51-1.04 2.18-.82 2.18-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.06-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          </a>
        </div>
        <div id="lang-switch" class="lang-switch"></div>
      </div>
    </header>
    <p class="updated"><span data-i18n="header.updated">Updated</span> <time id="reports-updated">__UPDATED__ UTC</time></p>
    <p class="lede">
      <span data-i18n="header.lede">Blockchain data analysis for tokenized properties on</span>
      <a href="https://binaryx.com">binaryx.com</a>.
    </p>
    <div class="navigation" role="tablist">
      <button type="button" id="show-projects" role="tab" aria-selected="false"  data-i18n="header.projectsButton">Projects</button>
      <button type="button" id="show-holders"  role="tab" aria-selected="true" data-i18n="header.holdersButton">Holders</button>
      <button type="button" id="show-trends"   role="tab" aria-selected="false" data-i18n="header.trendsButton">Trends</button>
    </div>
    <div class="tools">
      <label class="search">
        <span data-i18n="search.title">Search</span>
        <input id="holder-search" type="search" autocomplete="off">
      </label>
      <div class="holders-meta">
        <p id="holder-count" aria-live="polite"></p>
        <div id="holder-limit" class="holders-limit" role="group"></div>
      </div>
    </div>
    <p id="holder-empty" class="empty" hidden data-i18n="holders.empty">No holders match.</p>
    <div class="holders-scroll">
      <table>
        <thead>
          <tr>
            <th data-i18n="col.address">Address</th>
            <th data-i18n="col.properties">Properties</th>
            <th class="num" data-i18n="col.count">Count</th>
            <th class="num" data-i18n="col.totalUsdt">Total, USDT</th>
            <th class="num" data-i18n="col.month">Month Δ</th>
          </tr>
        </thead>
        <tbody id="holders-body">__HOLDERS_ROWS__</tbody>
      </table>
    </div>
    <p class="off-platform-note" data-i18n="holders.offPlatformP2P">* Includes P2P outside the platform. Total USDT is not accurate.</p>
    <p class="report-problem"><a href="https://github.com/aint/binaryxlens/issues" data-i18n="footer.reportProblem">Report a problem</a></p>
  </main>
  <script>__I18N_SCRIPT__</script>
  <script>
    (function () {
      document.getElementById('show-projects').addEventListener('click', function () {
        window.location.href = 'index.html';
      });
      document.getElementById('show-holders').addEventListener('click', function () {
        window.location.href = 'holders.html';
      });
      document.getElementById('show-trends').addEventListener('click', function () {
        window.location.href = 'trends.html';
      });

      const t = window.i18n.t;
      const search = document.getElementById("holder-search");
      const rows = Array.from(document.querySelectorAll("#holders-body tr"));
      const countEl = document.getElementById("holder-count");
      const empty = document.getElementById("holder-empty");
      const table = document.querySelector(".holders-scroll");
      search.placeholder = t("search.holdersPlaceholder");
      const queryParam = new URLSearchParams(location.search).get("q");
      if (queryParam) search.value = queryParam;
      document.querySelectorAll("#holders-body .usdt").forEach(function (el) {
        el.textContent = Number(el.textContent).toLocaleString(window.i18n.lang, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      });

      const limitChoices = [10, 25, 50, 0];
      const limitGroup = document.getElementById("holder-limit");
      let limit = 25;
      limitGroup.setAttribute("aria-label", t("holders.limit"));
      limitChoices.forEach(function (n) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = n ? String(n) : t("holders.all");
        button.setAttribute("aria-pressed", String(n === limit));
        button.addEventListener("click", function () {
          limitGroup.querySelectorAll("button").forEach(function (b) {
            b.setAttribute("aria-pressed", String(b === button));
          });
          limit = n;
          apply();
        });
        limitGroup.appendChild(button);
      });

      function apply() {
        const query = search.value.trim().toLowerCase();
        let shown = 0;
        rows.forEach(function (row) {
          const address = row.querySelector(".address").textContent.trim().toLowerCase();
          const match = row.textContent.toLowerCase().indexOf(query) !== -1 && (!limit || shown < limit);
          row.hidden = !match;
          row.classList.toggle("is-target", match && query !== "" && address === query);
          if (match) shown += 1;
        });
        table.hidden = shown === 0;
        empty.hidden = shown !== 0;
        countEl.textContent = t("holders.showing", { shown: shown, total: rows.length });
      }

      search.addEventListener("input", apply);
      apply();
      const targetRow = document.querySelector("#holders-body tr.is-target");
      if (targetRow) targetRow.scrollIntoView({ block: "center" });

      // Move asset links beyond the first N into a collapsible extra div
      rows.forEach(function (row) {
        const propsCell = row.querySelector('td.properties');
        if (!propsCell) return;
        const links = Array.from(propsCell.querySelectorAll('a'));
        const visibleCount = 2;
        if (links.length <= visibleCount) return;
        const extra = document.createElement('div');
        extra.className = 'extra-properties';
        extra.hidden = true;
        links.slice(visibleCount).forEach(link => extra.appendChild(link));
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = t("col.properties.showMore");
        btn.className = 'toggle-properties';
        btn.addEventListener('click', function () {
          const expanded = extra.hidden;
          extra.hidden = !expanded;
          btn.textContent = expanded ? t("col.properties.collapse") : t("col.properties.showMore");
          if (expanded) {
            extra.appendChild(btn);
          } else {
            propsCell.appendChild(btn);
          }
        });
        propsCell.appendChild(extra);
        propsCell.appendChild(btn);
      });
    })();
  </script>
</body>
</html>
