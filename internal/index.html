<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binaryx Lens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
      padding: 32px 16px 48px;
      line-height: 1.5;
    }
    main { max-width: 40rem; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em; margin: 0; flex: 1; min-width: 0; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .github-links { display: flex; align-items: center; gap: 6px; }
    .github-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      color: #444;
      text-decoration: none;
    }
    .github-links a:hover { background: #e8e8e8; color: #1a1a1a; }
    .github-links a:focus-visible { outline: 2px solid #0b57d0; outline-offset: 2px; }
    .github-links svg { display: block; width: 18px; height: 18px; }
    .lang-switch { display: flex; gap: 2px; flex-shrink: 0; }
    .lang-switch button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #444;
      cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .lede { color: #444; margin: 0 0 16px; font-size: 0.95rem; }
    .updated {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      font-size: 0.8rem;
      color: #555;
    }
    .updated time {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      color: #1a1a1a;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 999px;
      padding: 2px 10px;
    }
    .lede a, .report-problem a { color: #0b57d0; }
    .report-problem { margin: 16px 0 0; font-size: 0.85rem; }
    .tools { display: flex; flex-direction: column; gap: 12px; margin: 0 0 16px; }
    .search { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; font-weight: 600; }
    .search input {
      font: inherit;
      font-size: 0.95rem;
      font-weight: 400;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: inherit;
    }
    .search input:focus-visible, #type-filters button:focus-visible {
      outline: 2px solid #0b57d0;
      outline-offset: 2px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
    }
    #type-filters { display: flex; flex-wrap: wrap; gap: 4px; }
    #type-filters button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border: 1px solid #ccc;
      border-radius: 999px;
      background: #fff;
      color: #444;
      cursor: pointer;
    }
    #type-filters button[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    #project-count { margin: 0; font-size: 0.85rem; color: #555; font-variant-numeric: tabular-nums; }
    .empty {
      margin: 0;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      color: #444;
    }
    nav {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      color: #1a1a1a;
      text-decoration: none;
      border-bottom: 1px solid #eee;
    }
    nav a[hidden], nav[hidden] { display: none; }
    nav a:last-child, nav a.is-last { border-bottom: none; }
    nav a:hover { background: #f7f8fa; }
    .item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .name { font-weight: 550; }
    .props { color: #555; font-size: 0.8rem; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .tag-construction { background: #f4efe4; color: #7a5b2e; }
    .tag-rental { background: #e7f2ea; color: #1d6b3a; }
    .tag-redeemed { background: #e8eef6; color: #1e4a7a; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Binaryx Lens</h1>
      <div class="header-actions">
        <div class="github-links">
          <a href="https://github.com/aint/binaryxlens" target="_blank" rel="noopener noreferrer" aria-label="Star on GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.756 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
          </a>
          <a href="https://github.com/aint/binaryxlens#binaryx-lens" target="_blank" rel="noopener noreferrer" aria-label="Source code">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.18.82a7.49 7.49 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.51-1.04 2.18-.82 2.18-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.06-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          </a>
        </div>
        <div id="lang-switch" class="lang-switch"></div>
      </div>
    </header>
    <p class="updated"><span data-i18n="index.reportsUpdated">Reports updated</span> <time id="reports-updated">__REPORTS_UPDATED__ UTC</time></p>
    <p class="lede">
      <span data-i18n="index.lede">Blockchain data analysis for tokenized properties on</span>
      <a href="https://binaryx.com">binaryx.com</a>.
    </p>
    <div class="tools">
      <label class="search">
        <span data-i18n="index.search">Search</span>
        <input id="project-search" type="search" placeholder="Project or property" autocomplete="off">
      </label>
      <div class="filters">
        <div id="type-filters" role="group" data-i18n-aria="index.type">
          <button type="button" data-type-filter="all" data-i18n="index.all" aria-pressed="true">All</button>
          <button type="button" data-type-filter="rental" data-i18n="type.rental" aria-pressed="false">rental</button>
          <button type="button" data-type-filter="construction" data-i18n="type.construction" aria-pressed="false">construction</button>
          <button type="button" data-type-filter="redeemed" data-i18n="type.redeemed" aria-pressed="false">redeemed</button>
        </div>
        <p id="project-count" aria-live="polite"></p>
      </div>
    </div>
    <p id="project-empty" class="empty" hidden data-i18n="index.empty">No projects match. Clear the search or choose All.</p>
    <nav>
__INDEX_NAV__    </nav>
    <p class="report-problem"><a href="https://github.com/aint/binaryxlens/issues" data-i18n="index.reportProblem">Report a problem</a></p>
  </main>
  <script>__I18N_SCRIPT__</script>
  <script>
    (function () {
      const search = document.getElementById("project-search");
      const filters = document.getElementById("type-filters");
      const list = document.querySelector("nav");
      const rows = Array.from(list.querySelectorAll("a"));
      const countEl = document.getElementById("project-count");
      const empty = document.getElementById("project-empty");
      const t = window.i18n.t;

      search.placeholder = t("index.searchPlaceholder");

      function apply() {
        const query = search.value.trim().toLowerCase();
        const pressed = filters.querySelector('[aria-pressed="true"]');
        const type = pressed ? pressed.dataset.typeFilter : "all";
        let shown = 0;
        let last = null;
        rows.forEach(function (row) {
          const name = row.querySelector(".name");
          const props = row.querySelector(".props");
          const text = ((name ? name.textContent : "") + " " + (props ? props.textContent : "")).toLowerCase();
          const typeOk = type === "all" || row.querySelector(".tag-" + type);
          const match = text.indexOf(query) !== -1 && typeOk;
          row.hidden = !match;
          row.classList.remove("is-last");
          if (match) {
            shown += 1;
            last = row;
          }
        });
        if (last) last.classList.add("is-last");
        list.hidden = shown === 0;
        empty.hidden = shown !== 0;
        countEl.textContent = t("index.projects", { n: shown });
      }

      search.addEventListener("input", apply);
      filters.addEventListener("click", function (event) {
        const button = event.target.closest("[data-type-filter]");
        if (!button) return;
        filters.querySelectorAll("[data-type-filter]").forEach(function (el) {
          el.setAttribute("aria-pressed", String(el === button));
        });
        apply();
      });
      apply();
    })();
  </script>
</body>
</html>
