<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binaryx Lens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
      padding: 32px 16px 48px;
      line-height: 1.5;
    }
    main { max-width: 40rem; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 8px; }
    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
    .lang-switch { display: flex; gap: 2px; flex-shrink: 0; }
    .lang-switch button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      color: #444;
      cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .lede { color: #444; margin: 0 0 8px; font-size: 0.95rem; }
    .updated { color: #666; margin: 0 0 24px; font-size: 0.85rem; }
    .lede a { color: #0b57d0; }
    nav {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      color: #1a1a1a;
      text-decoration: none;
      border-bottom: 1px solid #eee;
    }
    nav a:last-child { border-bottom: none; }
    nav a:hover { background: #f7f8fa; }
    .item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .name { font-weight: 550; }
    .props { color: #555; font-size: 0.8rem; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-transform: lowercase;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .tag-construction { background: #f4efe4; color: #7a5b2e; }
    .tag-rental { background: #e7f2ea; color: #1d6b3a; }
    .tag-redeemed { background: #e8eef6; color: #1e4a7a; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Binaryx Lens</h1>
      <div id="lang-switch" class="lang-switch"></div>
    </header>
    <p class="lede">
      <span data-i18n="index.lede">Blockchain data analysis for tokenized properties on</span>
      <a href="https://binaryx.com">binaryx.com</a>.
    </p>
    <p class="updated"><span data-i18n="index.reportsUpdated">Reports updated</span> <time id="reports-updated">__REPORTS_UPDATED__ UTC</time></p>
    <nav>
__INDEX_NAV__    </nav>
  </main>
  <script>__I18N_SCRIPT__</script>
</body>
</html>
