name: Daily reports

on:
  schedule:
    # 00:00 UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate reports
        env:
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: go run .

      - name: Stamp index with job time
        run: |
          ts=$(date -u '+%Y-%m-%d %H:%M UTC')
          sed -i -E 's|(<p id="reports-updated" class="updated">)[^<]*(</p>)|\1Reports updated '"${ts}"'\2|' index.html
          grep -q "Reports updated ${ts}" index.html

      - name: Commit reports
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Refresh daily holder reports"
          file_pattern: "reports/*.html index.html"
