<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Project report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; width: 100%; }
body { font-family: system-ui, sans-serif; padding: 16px; }
h1 { font-size: 1.15rem; font-weight: 600; margin: 0; }
.page-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
.lang-switch { display: flex; gap: 2px; flex-shrink: 0; }
.lang-switch button {
	font: inherit;
	font-size: 0.72rem;
	font-weight: 600;
	padding: 2px 8px;
	border: 1px solid #ccc;
	border-radius: 4px;
	background: #fff;
	color: #444;
	cursor: pointer;
}
.lang-switch button[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
.project-summary { font-size: 0.9rem; color: #333; margin: 0 0 20px; line-height: 1.5; }
.project-summary p { margin: 0 0 4px; }
.grid {
	display: flex;
	flex-direction: column;
	gap: 24px;
	width: 100%;
	align-items: stretch;
}
.slot {
	border: 1px solid #e0e0e0;
	border-radius: 8px;
	padding: 10px 12px 14px;
	background: #fafafa;
	width: 100%;
}
.slot h3 { font-size: 0.95rem; font-weight: 600; margin: 0 0 8px; }
.property-head {
	display: flex;
	flex-direction: column;
	gap: 4px;
	margin: 0 0 12px;
}
.property-head h3 { margin: 0; font-size: 1.05rem; }
.property-scan {
	font-family: ui-monospace, monospace;
	font-size: 0.72rem;
	color: #1e4a7a;
	word-break: break-all;
}
.price-facts {
	display: flex;
	flex-wrap: wrap;
	align-items: flex-end;
	gap: 14px 28px;
	margin: 0 0 14px;
	padding-bottom: 12px;
	border-bottom: 1px solid #e8e8e8;
}
.price-metric { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.price-metric-tier { margin-left: auto; }
.price-label { font-size: 0.68rem; font-weight: 500; color: #777; }
.price-metric strong { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.price-ai-note {
	flex-basis: 100%;
	margin: 0;
	font-size: 0.72rem;
	line-height: 1.35;
	color: #8a5a00;
}
.value {
	align-self: flex-start;
	font-size: 0.75rem;
	font-weight: 600;
	line-height: 1.2;
	padding: 3px 8px;
	border-radius: 999px;
	white-space: nowrap;
}
.value-underpriced { background: #e7f2ea; color: #1d6b3a; }
.value-fair { background: #e8eef6; color: #1e4a7a; }
.value-rich { background: #fff4d6; color: #8a5a00; }
.value-overpriced { background: #fde8e8; color: #b42318; }
.slot-title {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 12px;
}
.slot .buys-wrap > summary { display: flex; align-items: flex-start; }
.tag {
	flex-shrink: 0;
	font-size: 0.68rem;
	font-weight: 600;
	line-height: 1.2;
	letter-spacing: 0.02em;
	text-transform: lowercase;
	padding: 2px 7px;
	border-radius: 999px;
	white-space: nowrap;
	background: #eee;
	color: #333;
}
.tag-construction { background: #f4efe4; color: #7a5b2e; }
.tag-rental { background: #e7f2ea; color: #1d6b3a; }
.tag-redeemed { background: #e8eef6; color: #1e4a7a; }
.slot-tags {
	display: flex;
	flex-wrap: wrap;
	justify-content: flex-end;
	gap: 4px;
	flex-shrink: 0;
}
.score {
	font-size: 0.68rem;
	font-weight: 600;
	line-height: 1.2;
	padding: 2px 7px;
	border-radius: 999px;
	white-space: nowrap;
}
.score-green { background: #e7f2ea; color: #1d6b3a; }
.score-yellow { background: #fff4d6; color: #8a5a00; }
.score-red { background: #fde8e8; color: #b42318; }
.rental-dates {
	display: block;
	font-size: 0.78rem;
	font-weight: 500;
	color: #444;
}
.slot .buys-wrap > summary {
	font-size: 0.95rem;
	font-weight: 600;
	cursor: pointer;
	list-style: none;
	margin: 0 0 8px;
}
.slot .buys-wrap > summary::-webkit-details-marker { display: none; }
.slot .buys-wrap > summary::before { content: "▸ "; }
.slot .buys-wrap[open] > summary::before { content: "▾ "; }
.chart-wrap {
	position: relative;
	width: 100%;
	height: 340px;
	max-width: 100%;
}
.chart-wrap canvas { display: block; max-width: 100%; cursor: crosshair; }
.zoom-reset {
	position: absolute;
	top: 0;
	right: 0;
	font-size: 0.7rem;
	padding: 2px 8px;
	border: 1px solid #ccc;
	border-radius: 4px;
	background: #fff;
	cursor: pointer;
}
.chart-placeholder { color: #666; font-size: 0.9rem; padding: 20px 8px; text-align: center; }
.slot .eta-wrap { margin-top: 10px; }
.slot .eta-wrap h4 { font-size: 0.85rem; font-weight: 600; margin: 0 0 6px; }
.slot .eta-wrap table { border-collapse: collapse; font-size: 0.75rem; width: 100%; }
.slot .eta-wrap th, .slot .eta-wrap td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
.slot .eta-wrap th { background: #eee; }
.slot .eta-wrap .muted { color: #666; font-size: 0.8rem; }
.slot .holders-wrap { margin-top: 12px; }
.slot .holders-wrap > summary {
	display: flex;
	align-items: center;
	gap: 8px;
	font-size: 0.95rem;
	font-weight: 600;
	cursor: pointer;
	list-style: none;
	margin: 0 0 6px;
}
.holders-limit {
	margin-left: auto;
	font: inherit;
	font-size: 0.75rem;
	font-weight: 500;
	padding: 1px 4px;
}
.slot .holders-wrap > summary::-webkit-details-marker { display: none; }
.slot .holders-wrap > summary::before { content: "▸ "; }
.slot .holders-wrap[open] > summary::before { content: "▾ "; }
.slot .holders-wrap .muted { color: #666; font-size: 0.8rem; }
.slot .holders-wrap .holders-scroll { overflow-x: auto; border: 1px solid #e0e0e0; border-radius: 8px; }
.slot .holders-wrap table { border-collapse: collapse; font-size: 0.75rem; width: 100%; }
.slot .holders-wrap th, .slot .holders-wrap td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; vertical-align: top; }
.slot .holders-wrap th { background: #eee; white-space: nowrap; }
.slot .holders-wrap td.num { text-align: right; white-space: nowrap; }
.slot .holders-wrap td.pair .usdt { display: block; color: #666; font-size: 0.92em; }
.slot .holders-wrap td.address { font-family: ui-monospace, monospace; font-size: 0.7rem; }
.slot .holders-wrap td.tier { white-space: nowrap; }
.slot .secondary-meta { font-size: 0.85rem; color: #444; margin: 0 0 8px; }
.slot > .secondary-meta { margin: 12px 0 6px; }
.slot .secondary-wrap { margin-top: 4px; }
.slot .secondary-wrap h4 { font-size: 0.95rem; font-weight: 600; margin: 0 0 8px; }
.holders-section { margin-top: 28px; }
.holders-section h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
.holders-section h3 { font-size: 0.9rem; font-weight: 600; margin: 20px 0 8px; }
.exited-holders { margin-top: 12px; }
.exited-holders h4 { font-size: 0.85rem; font-weight: 600; margin: 0 0 6px; }
.tier-layout {
	display: flex;
	flex-wrap: wrap;
	gap: 16px 24px;
	align-items: center;
}
.tier-chart-wrap {
	position: relative;
	width: min(100%, 420px);
	height: 300px;
	flex: 1 1 280px;
	max-width: 480px;
}
.tier-chart-wrap canvas { display: block; max-width: 100%; }
.holders-section details.holders-collapse { margin-top: 20px; }
.holders-section details.holders-collapse > summary {
	display: flex;
	align-items: center;
	gap: 8px;
	font-size: 0.9rem;
	font-weight: 600;
	cursor: pointer;
	list-style: none;
	margin: 0 0 8px;
}
.holders-section details.holders-collapse > summary::-webkit-details-marker { display: none; }
.holders-section details.holders-collapse > summary::before { content: "▸ "; }
.holders-section details.holders-collapse[open] > summary::before { content: "▾ "; }
.section-meta { font-size: 0.85rem; color: #444; margin: 0 0 10px; }
.holders-scroll { overflow-x: auto; border: 1px solid #e0e0e0; border-radius: 8px; }
.holders-section table { border-collapse: collapse; font-size: 0.8rem; width: 100%; }
.holders-section th, .holders-section td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
.holders-section th { background: #eee; white-space: nowrap; }
.holders-section td.num { text-align: right; white-space: nowrap; }
.holders-section td.pair .usdt { display: block; color: #666; font-size: 0.92em; }
.holders-section td.address { font-family: ui-monospace, monospace; font-size: 0.75rem; }
.holders-section td.properties { min-width: 200px; max-width: 420px; }
.holders-section td.tier { white-space: nowrap; }
td.trend.up { color: #1a7f37; }
td.trend.down { color: #cf222e; }
td.trend.flat { color: #888; }
</style>
</head>

			</table>
		</div>
		<div id="holders-exited"></div>
	</details>
</section>

	const STORAGE_KEY = "lang";

	function storedLang() {
		try {
			return localStorage.getItem(STORAGE_KEY);
		} catch (e) {
			return null;
		}
	}

	// ?lang= wins over the saved choice, which wins over the browser language.
	function detectLang() {
		const candidates = [
			new URLSearchParams(location.search).get("lang"),
			storedLang(),
			(navigator.language || "").slice(0, 2).toLowerCase()
		];
		for (const code of candidates) {
			if (code && I18N[code]) return code;
		}
		return "en";
	}

	const lang = detectLang();
	const pluralRules = new Intl.PluralRules(lang);
	document.documentElement.lang = lang;

	function has(key) {
		return key in I18N[lang] || key in I18N.en;
	}

	// Plural entries are objects keyed by Intl.PluralRules category and pick a form by vars.n.
	function t(key, vars) {
		let msg = key in I18N[lang] ? I18N[lang][key] : I18N.en[key];
		if (msg == null) return key;
		if (typeof msg === "object") {
			msg = msg[pluralRules.select(Number(vars && vars.n))] || msg.other;
		}
		if (!vars) return msg;
		return msg.replace(/\{(\w+)\}/g, function (match, name) {
			return vars[name] != null ? String(vars[name]) : match;
		});
	}

	function applyStatic() {
		document.querySelectorAll("[data-i18n]").forEach(function (el) {
			el.textContent = t(el.dataset.i18n);
		});
		document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
			el.setAttribute("aria-label", t(el.dataset.i18nAria));
		});
	}

	function switchTo(code) {
		try {
			localStorage.setItem(STORAGE_KEY, code);
		} catch (e) {
			// The ?lang= param below still carries the choice for this page.
		}
		const url = new URL(location.href);
		url.searchParams.set("lang", code);
		location.href = url.toString();
	}

	function mountSwitcher() {
		const slot = document.getElementById("lang-switch");
		if (!slot) return;
		slot.setAttribute("role", "group");
		slot.setAttribute("aria-label", t("lang.label"));
		Object.keys(I18N).forEach(function (code) {
			const button = document.createElement("button");
			button.type = "button";
			button.textContent = code.toUpperCase();
			button.setAttribute("aria-pressed", String(code === lang));
			button.addEventListener("click", function () {
				if (code !== lang) switchTo(code);
			});
			slot.appendChild(button);
		});
	}

	applyStatic();
	mountSwitcher();
	window.i18n = { lang: lang, t: t, has: has };
})();
</script>

<script>
(function () {
	const t = window.i18n.t;
	const raw = document.getElementById("project-data").textContent;
	let projectData;
	try {
		projectData = JSON.parse(raw);
	} catch (e) {
		document.body.innerHTML = "<p>" + escapeHtml(t("report.invalidJson")) + "</p>";
		return;
	}

	function propertyTypeTag(property) {
		const type = property && property.type;
		if (!type) return null;
		const tag = document.createElement("span");
		tag.className = "tag tag-" + type;
		tag.textContent = t("type." + type);
		return tag;
	}

	function rentalScoreLabel(rental) {
		const delay = rental.delayQuarters;
		if (delay == null || delay <= 0) return t("rental.onTime");
		return t("rental.delay", { n: delay });
	}

	function rentalScoreTag(property) {
		const rental = property && property.rental;
		if (!rental || !rental.score) return null;
		const tag = document.createElement("span");
		tag.className = "score score-" + rental.score;
		tag.textContent = rentalScoreLabel(rental);
		return tag;
	}

	function rentalAgeText(years) {
		const label = t("rental.years", { n: years });
		const shown = years.toLocaleString(window.i18n.lang, { maximumFractionDigits: 2 });
		return label.replace(String(years), shown);
	}

	function rentalDatesLine(property) {
		const rental = property && property.rental;
		if (!rental || !rental.expected) return null;
		const line = document.createElement("span");
		line.className = "rental-dates";
		const actual = rental.actual ? rental.actual : t("rental.notStarted");
		line.textContent = t("rental.dates", { expected: rental.expected, actual: actual });
		return line;
	}

	function escapeHtml(s) {
		if (s == null || s === "") return "";
		return String(s)
			.replace(/&/g, "&amp;")
			.replace(/</g, "&lt;")
			.replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;");
	}

	if (projectData.name) {
		document.title = projectData.name;
		document.getElementById("project-title").textContent = projectData.name;
	}

	if (projectData.summary) {
		const s = projectData.summary;
		document.getElementById("project-summary").innerHTML =
			"<p>" + escapeHtml(t("summary.properties")) + ": <strong>" + s.propertyCount + "</strong></p>" +
			"<p>" + escapeHtml(t("summary.totalSupply")) + ": <strong>" + escapeHtml(s.totalSupply) + "</strong></p>" +
			"<p>" + escapeHtml(t("summary.bought")) + ": <strong>" + s.boughtPct.toFixed(2) + "%</strong> (" + escapeHtml(t("summary.tokens", { n: s.bought })) + ")</p>";
	}

	const allProperties = Array.isArray(projectData.properties) ? projectData.properties : [];
	const allHolders = Array.isArray(projectData.holders) ? projectData.holders : [];
	const tierStats = Array.isArray(projectData.tierStats) ? projectData.tierStats : [];
	const propertyHoldersDefault = 10;
	const projectHoldersDefault = 25;
	const grid = document.getElementById("grid");
	const chartInstances = [];

	function etaDate(row) {
		const date = row && row.date;
		return date && date !== "0001-01-01" ? date : "";
	}

	// Trailing windows arrive as keys; a completed sale sends its date range as-is.
	function etaWindowLabel(name) {
		return i18n.has("eta." + name) ? t("eta." + name) : name;
	}

	function renderPropertyHead(slot, property) {
		const head = document.createElement("div");
		head.className = "property-head";
		const titleRow = document.createElement("span");
		titleRow.className = "slot-title";
		const name = document.createElement("h3");
		name.textContent = property && property.name ? property.name : "—";
		titleRow.appendChild(name);
		const tags = document.createElement("span");
		tags.className = "slot-tags";
		const typeTag = propertyTypeTag(property);
		if (typeTag) tags.appendChild(typeTag);
		const scoreTag = rentalScoreTag(property);
		if (scoreTag) tags.appendChild(scoreTag);
		if (tags.childNodes.length) titleRow.appendChild(tags);
		head.appendChild(titleRow);
		if (property && property.address) {
			const scan = document.createElement("a");
			scan.className = "property-scan";
			scan.href = "https://polygonscan.com/token/" + property.address;
			scan.target = "_blank";
			scan.rel = "noopener noreferrer";
			scan.textContent = property.address;
			head.appendChild(scan);
		}
		const rentalDates = rentalDatesLine(property);
		if (rentalDates) head.appendChild(rentalDates);
		slot.appendChild(head);
	}

	function renderPriceInto(slot, property) {
		const price = property && property.price;
		if (!price) return;
		const block = document.createElement("div");
		block.className = "price-facts";

		function amount(n) {
			return n ? Number(n).toLocaleString(window.i18n.lang) : "";
		}
		function metric(labelKey, valueEl, tierCell) {
			const cell = document.createElement("div");
			cell.className = tierCell ? "price-metric price-metric-tier" : "price-metric";
			const label = document.createElement("span");
			label.className = "price-label";
			label.textContent = t(labelKey);
			cell.appendChild(label);
			cell.appendChild(valueEl);
			block.appendChild(cell);
		}
		function strong(text) {
			const el = document.createElement("strong");
			el.textContent = text || "—";
			return el;
		}
		function marketRange() {
			const low = amount(price.marketLow);
			const high = amount(price.marketHigh);
			if (low && high) return low === high ? low : low + " – " + high;
			return low || high;
		}
		const tier = price.estimatedValueTier;
		const tierEl = document.createElement("span");
		if (tier && i18n.has("value." + tier)) {
			tierEl.className = "value value-" + tier;
			tierEl.textContent = t("value." + tier);
		} else {
			tierEl.textContent = "—";
		}

		metric("price.area", strong(amount(price.areaM2)));
		metric("price.binaryx", strong(amount(price.binaryx)));
		metric("price.market", strong(marketRange()));
		const ageYears = property.rental && property.rental.ageYears;
		if (ageYears != null) metric("price.age", strong(rentalAgeText(ageYears)));
		metric("price.valueTier", tierEl, true);
		if (price.marketLow || price.marketHigh || tier) {
			const note = document.createElement("p");
			note.className = "price-ai-note";
			const parts = new Intl.DateTimeFormat(window.i18n.lang, { month: "long", year: "numeric", timeZone: "UTC" }).formatToParts(new Date(Date.UTC(2026, 9, 1)));
			const when = parts.filter(function (p) { return p.type === "month" || p.type === "year"; }).map(function (p) { return p.value; }).join(" ");
			note.textContent = t("price.aiNote", { when: when });
			block.appendChild(note);
		}
		slot.appendChild(block);
	}

	function renderETAsInto(container, chartData) {
		const rows = chartData.etas;
		if (!rows || rows.length === 0) {
			container.innerHTML = "<h4>" + escapeHtml(t("eta.title")) + "</h4><p class=\"muted\">" + escapeHtml(t("eta.none")) + "</p>";
			return;
		}
		const times = rows.map(etaDate).filter(Boolean).sort();
		const showDate = times.length > 0;
		let band = "";
		if (times.length >= 2) {
			band = "<p class=\"muted\">" + escapeHtml(t("eta.band")) + ": <strong>" + escapeHtml(times[0]) + "</strong> … <strong>" + escapeHtml(times[times.length - 1]) + "</strong></p>";
		}
		const body = rows.map(function (r) {
			let row = "<tr><td>" + escapeHtml(etaWindowLabel(r.window)) + "</td><td>" + escapeHtml(r.rate) + "</td><td>" + r.days + "</td>";
			if (showDate) {
				row += "<td>" + escapeHtml(etaDate(r)) + "</td>";
			}
			return row + "</tr>";
		}).join("");
		const heading = showDate ? "<h4>" + escapeHtml(t("eta.title")) + "</h4>" : "";
		container.innerHTML =
			heading +
			band +
			"<table><thead><tr><th>" + escapeHtml(t("eta.window")) + "</th><th>" + escapeHtml(t("eta.rate")) + "</th><th>" + escapeHtml(t("eta.days")) + "</th>" + (showDate ? "<th>" + escapeHtml(t("eta.date")) + "</th>" : "") + "</tr></thead><tbody>" +
			body +
			"</tbody></table>";
	}

	function formatUSDT(raw) {
		if (raw == null || raw === "") return "";
		const s = String(raw);
		const plus = s.charAt(0) === "+";
		let body = plus ? s.slice(1) : s;
		const neg = body.charAt(0) === "-";
		if (neg) body = body.slice(1);
		const dot = body.indexOf(".");
		const whole = dot < 0 ? body : body.slice(0, dot);
		const frac = dot < 0 ? "" : body.slice(dot + 1);
		if (!/^\d+$/.test(whole)) return s;
		const grouped = Number(whole).toLocaleString(window.i18n.lang, { maximumFractionDigits: 0 });
		let out = grouped;
		if (frac) {
			const dec = (1.1).toLocaleString(window.i18n.lang).replace(/\d/g, "");
			out += dec + frac;
		}
		if (neg) return "-" + out;
		if (plus) return "+" + out;
		return out;
	}

	function trendCell(delta, usdt) {
		const tokenFlat = !delta || delta === "0";
		const paid = usdt || "0";
		if (tokenFlat && paid === "0") {
			return "<td class=\"num trend flat\">—</td>";
		}
		let cls = "flat";
		let tokenHtml = "—";
		if (!tokenFlat) {
			const down = delta.charAt(0) === "-";
			cls = down ? "down" : "up";
			tokenHtml = (down ? "↓ " : "↑ ") + escapeHtml(delta);
		}
		return "<td class=\"num trend pair " + cls + "\">" + tokenHtml +
			"<span class=\"usdt\">" + escapeHtml(formatUSDT(paid)) + " USDT</span></td>";
	}

	function addUSDT(a, b) {
		const scale = 1000000;
		const sum = Math.round(((Number(a) || 0) + (Number(b) || 0)) * scale);
		const sign = sum < 0 ? "-" : "";
		const abs = Math.abs(sum);
		const whole = Math.trunc(abs / scale);
		const frac = String(abs % scale).padStart(6, "0").replace(/0+$/, "");
		return sign + whole + (frac ? "." + frac : "");
	}

	function amountPair(tokens, usdt) {
		return "<td class=\"num pair\"><span>" + escapeHtml(tokens) +
			"</span><span class=\"usdt\">" + escapeHtml(formatUSDT(usdt)) + " USDT</span></td>";
	}

	function amountPairOrDash(tokens, usdt) {
		const tokenFlat = !tokens || tokens === "0";
		const paid = usdt || "0";
		if (tokenFlat && paid === "0") {
			return "<td class=\"num trend flat\">—</td>";
		}
		return amountPair(tokens, usdt);
	}

	const holderLimitChoices = [10, 25, 50, 0];

	function shownHolders(holders, limit) {
		if (!limit) return holders;
		return holders.slice(0, limit);
	}

	function deltaNumber(v) {
		const n = Number(v);
		return isFinite(n) ? n : 0;
	}

	function splitHolders(holders) {
		const active = [];
		const exited = [];
		holders.forEach(function (h) {
			(deltaNumber(h.balance) === 0 ? exited : active).push(h);
		});
		exited.sort(function (a, b) {
			const week = deltaNumber(a.weekDeltaTokens) - deltaNumber(b.weekDeltaTokens);
			if (week !== 0) return week;
			return deltaNumber(a.monthDeltaTokens) - deltaNumber(b.monthDeltaTokens);
		});
		return { active: active, exited: exited };
	}

	function tierCell(h) {
		if (!h.tier) return "<td class=\"tier\">—</td>";
		return "<td class=\"tier\">" + escapeHtml(t("tier." + h.tier)) + "</td>";
	}

	function holderRow(h, i, withProperties) {
		const names = withProperties
			? "<td class=\"properties\">" + escapeHtml((h.propertyNames || []).join(", ")) + "</td>"
			: "";
		return "<tr>" +
			"<td class=\"num\">" + (i + 1) + "</td>" +
			"<td class=\"address\">" + escapeHtml(h.address) + "</td>" +
			names +
			amountPair(h.balance, addUSDT(h.initSaleUSDT, h.p2pUSDT)) +
			amountPairOrDash(h.initialBought, h.initSaleUSDT) +
			amountPairOrDash(h.p2pBought, h.p2pUSDT) +
			trendCell(h.weekDeltaTokens, h.weekDeltaUSDT) +
			trendCell(h.monthDeltaTokens, h.monthDeltaUSDT) +
			"<td class=\"num\">" + (h.supplyPct != null ? h.supplyPct.toFixed(2) : "0.00") + "%</td>" +
			tierCell(h) +
			"</tr>";
	}

	function holdersTable(rows, columns) {
		return "<div class=\"holders-scroll\"><table><thead><tr>" +
			"<th>#</th>" + columns.map(function (key) {
				return "<th>" + escapeHtml(t(key)) + "</th>";
			}).join("") +
			"</tr></thead><tbody>" + rows + "</tbody></table></div>";
	}

	function exitedBlock(exited, columns, withProperties) {
		if (exited.length === 0) return "";
		const rows = exited.map(function (h, i) {
			return holderRow(h, i, withProperties);
		}).join("");
		return "<div class=\"exited-holders\"><h4>" + escapeHtml(t("holders.exited")) + "</h4>" +
			holdersTable(rows, columns) + "</div>";
	}

	const propertyHolderColumns = ["col.address", "col.balance", "col.initialBought", "col.p2pBought", "col.week", "col.month", "col.supplyPct", "col.tier"];
	const projectHolderColumns = ["col.address", "col.propertyNames", "col.balance", "col.initialBought", "col.p2pBought", "col.week", "col.month", "col.supplyPct", "col.tier"];

	function holdersHeading(limit) {
		return limit ? t("holders.top", { n: limit }) : t("holders.allTitle");

	// Clicks on the select must not toggle the surrounding details element.
	function holdersLimitControl(selected, onChange) {
		const select = document.createElement("select");
		select.className = "holders-limit";
		select.setAttribute("aria-label", t("holders.limit"));
		holderLimitChoices.forEach(function (n) {
			const option = document.createElement("option");
			option.value = String(n);
			option.textContent = n ? String(n) : t("holders.all");
			if (n === selected) option.selected = true;
			select.appendChild(option);
		});
		select.addEventListener("mousedown", function (e) { e.stopPropagation(); });
		select.addEventListener("click", function (e) { e.stopPropagation(); });
		select.addEventListener("change", function () {
			onChange(Number(select.value));
		});
		return select;
	}

	function renderPropertyHoldersInto(container, property) {
		const holders = property && Array.isArray(property.holders) ? property.holders : [];
		const label = document.createElement("span");
		const summary = document.createElement("summary");
		summary.appendChild(label);
		const body = document.createElement("div");
		container.appendChild(summary);
		container.appendChild(body);
		const split = splitHolders(holders);
		if (split.active.length === 0 && split.exited.length === 0) {
			label.textContent = t("holders.none");
			return;
		}
		let limit = propertyHoldersDefault;
		function paint() {
			label.textContent = split.active.length === 0 ? t("holders.none") : holdersHeading(limit);
			const rows = shownHolders(split.active, limit).map(function (h, i) {
				return holderRow(h, i, false);
			}).join("");
			const activeTable = split.active.length === 0 ? "" : holdersTable(rows, propertyHolderColumns);
			body.innerHTML = activeTable + exitedBlock(split.exited, propertyHolderColumns, false);
		}
		summary.appendChild(holdersLimitControl(limit, function (next) {
			limit = next;
			paint();
		}));
		paint();
	}

	function chartOptions(dailyLabel, cumLabel) {
		return {
			responsive: true,
			maintainAspectRatio: false,
			interaction: { mode: "index", intersect: false },
			scales: {
				x: { ticks: { maxTicksLimit: 24 } },
				y: {
					type: "linear",
					position: "left",
					beginAtZero: true,
					title: { display: true, text: dailyLabel, font: { size: 10 } }
				},
				y1: {
					type: "linear",
					position: "right",
					beginAtZero: true,
					grid: { drawOnChartArea: false },
					title: { display: true, text: cumLabel, font: { size: 10 } }
				}
			}
		};
	}

	// Drag across the plot area to zoom the x axis to that range; "Reset zoom" restores it.
	const rangeSelectPlugin = {
		id: "rangeSelect",
		afterInit: function (chart) {
			const canvas = chart.canvas;
			const state = chart.$rangeSelect = { start: null, end: null };

			const reset = document.createElement("button");
			reset.type = "button";
			reset.className = "zoom-reset";
			reset.textContent = t("resetZoom");
			reset.hidden = true;
			reset.addEventListener("click", function () {
				chart.options.scales.x.min = undefined;
				chart.options.scales.x.max = undefined;
				reset.hidden = true;
				chart.update();
			});
			canvas.parentElement.appendChild(reset);

			function pointerX(e) {
				return e.clientX - canvas.getBoundingClientRect().left;
			}
			function clampX(x) {
				return Math.min(Math.max(x, chart.chartArea.left), chart.chartArea.right);
			}
			function cancel() {
				state.start = state.end = null;
				chart.draw();
			}

			canvas.addEventListener("pointerdown", function (e) {
				if (e.button !== 0) return;
				const x = pointerX(e);
				if (x < chart.chartArea.left || x > chart.chartArea.right) return;
				e.preventDefault();
				state.start = state.end = x;
				canvas.setPointerCapture(e.pointerId);
			});
			canvas.addEventListener("pointermove", function (e) {
				if (state.start == null) return;
				state.end = clampX(pointerX(e));
				chart.draw();
			});
			canvas.addEventListener("pointerup", function () {
				if (state.start == null) return;
				const from = Math.min(state.start, state.end);
				const to = Math.max(state.start, state.end);
				const lo = chart.scales.x.getValueForPixel(from);
				const hi = chart.scales.x.getValueForPixel(to);
				if (to - from < 5 || hi <= lo) {
					cancel();
					return;
				}
				state.start = state.end = null;
				chart.options.scales.x.min = lo;
				chart.options.scales.x.max = hi;
				reset.hidden = false;
				chart.update();
			});
			canvas.addEventListener("pointercancel", cancel);
		},
		afterDraw: function (chart) {
			const state = chart.$rangeSelect;
			if (!state || state.start == null || state.start === state.end) return;
			const area = chart.chartArea;
			const ctx = chart.ctx;
			ctx.save();
			ctx.fillStyle = "rgba(54, 162, 235, 0.15)";
			ctx.fillRect(Math.min(state.start, state.end), area.top, Math.abs(state.end - state.start), area.bottom - area.top);
			ctx.restore();
		}
	};

	function hasSecondaryVolume(property) {
		const secondary = property && property.p2p_sales ? property.p2p_sales : null;
		return !!(secondary && secondary.labels && secondary.labels.length > 0);
	}

	function mountDailyChart(canvas, initial) {
		const ch = new Chart(canvas, {
			type: "line",
			data: {
				labels: initial.labels,
				datasets: [
					{
						label: t("chart.dailyDelta"),
						data: initial.daily,
						borderColor: "rgb(75, 192, 192)",
						backgroundColor: "rgba(75, 192, 192, 0.2)",
						tension: 0,
						stepped: "before",
						fill: false,
						yAxisID: "y"
					},
					{
						label: t("chart.cumulative"),
						data: initial.cumulative,
						borderColor: "rgb(255, 99, 132)",
						tension: 0.05,
						fill: false,
						yAxisID: "y1"
					}
				]
			},
			options: chartOptions(t("chart.dailyDelta"), t("chart.cumulative")),
			plugins: [rangeSelectPlugin]
		});
		chartInstances.push(ch);
		return ch;
	}

	function renderSecondaryInto(slot, property) {
		const secondary = property && property.p2p_sales ? property.p2p_sales : null;
		const txCount = secondary && typeof secondary.txCount === "number" ? secondary.txCount : 0;
		const hasVolume = hasSecondaryVolume(property);

		const meta = document.createElement("p");
		meta.className = "secondary-meta";
		if (!hasVolume) {
			meta.innerHTML = escapeHtml(t("secondary.market")) + ": <strong>" + escapeHtml(t("secondary.noTransfers")) + "</strong>";
			slot.appendChild(meta);
			return;
		}
		meta.innerHTML = escapeHtml(t("secondary.txs")) + ": <strong>" + txCount + "</strong>";

		const wrap = document.createElement("div");
		wrap.className = "secondary-wrap";
		const heading = document.createElement("h4");
		heading.textContent = t("secondary.title");
		wrap.appendChild(heading);
		wrap.appendChild(meta);

		const chartWrap = document.createElement("div");
		chartWrap.className = "chart-wrap";
		const canvas = document.createElement("canvas");
		chartWrap.appendChild(canvas);
		wrap.appendChild(chartWrap);
		slot.appendChild(wrap);

		const ch = new Chart(canvas, {
			type: "bar",
			data: {
				labels: secondary.labels,
				datasets: [
					{
						type: "bar",
						label: t("chart.weeklyVolume"),
						data: secondary.weekly,
						backgroundColor: "rgba(54, 162, 235, 0.45)",
						borderColor: "rgb(54, 162, 235)",
						borderWidth: 1,
						yAxisID: "y"
					},
					{
						type: "line",
						label: t("chart.cumulative"),
						data: secondary.cumulative,
						borderColor: "rgb(255, 159, 64)",
						tension: 0.05,
						fill: false,
						yAxisID: "y1"
					}
				]
			},
			options: chartOptions(t("chart.weeklyVolume"), t("chart.cumulative")),
			plugins: [rangeSelectPlugin]
		});
		chartInstances.push(ch);
	}

	function renderHolders() {
		const section = document.getElementById("holders-section");
		if (allHolders.length === 0) {
			section.hidden = true;
			return;
		}

		const showGlobal = allProperties.length > 1;
		const globalBlock = document.getElementById("global-holders-block");
		globalBlock.hidden = !showGlobal;

		if (showGlobal) {
			const summary = globalBlock.querySelector("summary");
			const split = splitHolders(allHolders);
			let limit = projectHoldersDefault;
			function paint() {
				const shown = shownHolders(split.active, limit);
				document.getElementById("holders-meta").textContent =
					t("holders.showing", { shown: shown.length, total: split.active.length });
				document.getElementById("holders-body").innerHTML = shown.map(function (h, i) {
					return holderRow(h, i, true);
				}).join("");
				document.getElementById("holders-exited").innerHTML =
					exitedBlock(split.exited, projectHolderColumns, true);
			}
			summary.appendChild(holdersLimitControl(limit, function (next) {
				limit = next;
				paint();
			}));
			paint();
		}

		renderTierCharts();
	}

	const tierPalette = ["#94a3b8", "#fb923c", "#38bdf8", "#6366f1", "#10b981", "#1e40af"];

	function formatTokens(n) {
		if (!isFinite(n)) return "0";
		const rounded = Math.round(n * 100) / 100;
		if (Math.abs(rounded - Math.round(rounded)) < 1e-6) return String(Math.round(rounded));
		return rounded.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
	}

	function tierTokenTotals() {
		const totals = {};
		allHolders.forEach(function (h) {
			const n = Number(h.balance);
			if (!isFinite(n) || n === 0) return;
			totals[h.tier] = (totals[h.tier] || 0) + n;
		});
		return totals;
	}

	function tierSlices(include) {
		const tokens = tierTokenTotals();
		const slices = [];
		tierStats.forEach(function (s, i) {
			if (!include(s)) return;
			slices.push({
				stat: s,
				tokens: tokens[s.name] || 0,
				color: tierPalette[i % tierPalette.length]
			});
		});
		return slices;
	}

	function tierTooltip(slices) {
		return {
			callbacks: {
				label: function (ctx) {
					const slice = slices[ctx.dataIndex];
					const s = slice.stat;
					return [
						" " + t("tier.tokens", { v: formatTokens(slice.tokens) }),
						" " + t("tier.supplyPct", { v: s.supplyPct.toFixed(2) }),
						" " + t("tier.holdersPct", { v: s.holdersPct.toFixed(1) })
					];
				}
			}
		};
	}

	function mountTierPie(canvasId, title, values, slices) {
		const canvas = document.getElementById(canvasId);
		if (slices.length === 0) {
			canvas.parentElement.innerHTML = "<div class=\"chart-placeholder\">" + escapeHtml(t("tier.noData")) + "</div>";
			return;
		}
		const ch = new Chart(canvas, {
			type: "pie",
			data: {
				labels: slices.map(function (s) { return t("tier." + s.stat.name); }),
				datasets: [{
					data: slices.map(function (s) { return values(s); }),
					backgroundColor: slices.map(function (s) { return s.color; }),
					borderColor: "#fff",
					borderWidth: 2
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				plugins: {
					title: {
						display: true,
						text: title,
						font: { size: 13, weight: "600" }
					},
					legend: {
						position: "bottom",
						labels: { boxWidth: 12, font: { size: 12 } }
					},
					tooltip: tierTooltip(slices)
				}
			}
		});
		chartInstances.push(ch);
	}

	function renderTierCharts() {
		mountTierPie(
			"tier-holders-chart",
			t("tier.holdersChart"),
			function (s) { return s.stat.count; },
			tierSlices(function (s) { return s.count > 0; })
		);
		mountTierPie(
			"tier-supply-chart",
			t("tier.supplyChart"),
			function (s) { return s.stat.supplyPct; },
			tierSlices(function (s) { return s.supplyPct > 0; })
		);
	}

	function renderCharts() {
		grid.innerHTML = "";

		if (allProperties.length === 0) {
			grid.innerHTML = "<p class=\"chart-placeholder\">" + escapeHtml(t("noProperties")) + "</p>";
			return;
		}

		allProperties.forEach(function (property) {
			const initial = property && property.initial_sales ? property.initial_sales : null;
			const collapseBuys = hasSecondaryVolume(property);
			const slot = document.createElement("div");
			slot.className = "slot";
			renderPropertyHead(slot, property);
			renderPriceInto(slot, property);
			const title = document.createElement(collapseBuys ? "summary" : "h3");
			title.textContent = t("initialSales");

			const chartParent = document.createElement(collapseBuys ? "details" : "div");
			if (collapseBuys) {
				chartParent.className = "buys-wrap";
			}
			chartParent.appendChild(title);

			const wrap = document.createElement("div");
			wrap.className = "chart-wrap";
			const canvas = document.createElement("canvas");
			wrap.appendChild(canvas);
			chartParent.appendChild(wrap);

			const etaWrap = document.createElement("div");
			etaWrap.className = "eta-wrap";
			chartParent.appendChild(etaWrap);
			slot.appendChild(chartParent);

			grid.appendChild(slot);

			const holdersWrap = document.createElement("details");
			holdersWrap.className = "holders-wrap";

			const hasSeries = initial && initial.labels && initial.labels.length > 0;
			if (!hasSeries) {
				wrap.innerHTML = "<div class=\"chart-placeholder\">" + escapeHtml(t("noSeries")) + "</div>";
				etaWrap.innerHTML = "<h4>" + escapeHtml(t("eta.title")) + "</h4><p class=\"muted\">—</p>";
			} else if (collapseBuys) {
				let chart = null;
				chartParent.addEventListener("toggle", function () {
					if (!chartParent.open) return;
					requestAnimationFrame(function () {
						if (!chart) {
							chart = mountDailyChart(canvas, initial);
							return;
						}
						chart.resize();
					});
				});
				renderETAsInto(etaWrap, initial);
			} else {
				mountDailyChart(canvas, initial);
				renderETAsInto(etaWrap, initial);
			}

			renderSecondaryInto(slot, property);
			renderPropertyHoldersInto(holdersWrap, property);
			slot.appendChild(holdersWrap);
		});
	}

	renderHolders();
	renderCharts();
})();
</script>
</body>
</html>
