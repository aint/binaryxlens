<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; width: 100%; }
body { font-family: system-ui, sans-serif; padding: 16px; }
h1 { font-size: 1.15rem; font-weight: 600; margin: 0; }
.page-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
.lang-switch { display: flex; gap: 2px; flex-shrink: 0; }
.lang-switch button {
	font: inherit;
	font-size: 0.72rem;
	font-weight: 600;
	padding: 2px 8px;
	border: 1px solid #ccc;
	border-radius: 4px;
	background: #fff;
	color: #444;
	cursor: pointer;
}
.lang-switch button[aria-pressed="true"] { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
.project-summary { font-size: 0.9rem; color: #333; margin: 0 0 20px; line-height: 1.5; }
.project-summary p { margin: 0 0 4px; }
.grid {
	display: flex;
	flex-direction: column;
	gap: 24px;
}
.slot {
	border: 1px solid #e0e0e0;
	border-radius: 8px;
	padding: 10px 12px 14px;
	background: #fafafa;
}
summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
.slot h3 { font-size: 0.95rem; font-weight: 600; margin: 0 0 8px; }
.property-head {
	display: flex;
	flex-direction: column;
	gap: 4px;
	margin: 0 0 12px;
}
.property-head h3 { margin: 0; font-size: 1.05rem; }
.property-links {
	display: flex;
	flex-wrap: wrap;
	align-items: baseline;
	gap: 4px 14px;
}
.property-link {
	font-size: 0.72rem;
	font-weight: 600;
	color: #1e4a7a;
}
.price-facts,
.rental-facts {
	display: flex;
	flex-wrap: wrap;
	align-items: flex-start;
	gap: 14px 28px;
	margin: 0 0 14px;
	padding-bottom: 12px;
	border-bottom: 1px solid #e8e8e8;
}
.rental-facts { align-items: flex-end; }
.metric { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
.price-figure { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.metric-label { font-size: 0.68rem; font-weight: 500; color: #777; }
.metric strong { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.price-ai-note {
	flex-basis: 100%;
	margin: 0;
	font-size: 0.72rem;
	line-height: 1.35;
	color: #8a5a00;
}
.value {
	display: inline-flex;
	align-items: center;
	gap: 5px;
	font-size: 0.68rem;
	font-weight: 600;
	line-height: 1.2;
	white-space: nowrap;
}
.value::before {
	content: "";
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: currentColor;
}
.value-underpriced { color: #1d6b3a; }
.value-fair { color: #1e4a7a; }
.value-rich { color: #8a5a00; }
.value-overpriced { color: #b42318; }
.slot-title {
	display: flex;
	align-items: flex-start;
	justify-content: space-between;
	gap: 12px;
}
.tag {
	flex-shrink: 0;
	font-size: 0.68rem;
	font-weight: 600;
	line-height: 1.2;
	letter-spacing: 0.02em;
	text-transform: lowercase;
	padding: 2px 7px;
	border-radius: 999px;
	white-space: nowrap;
	background: #eee;
	color: #333;
}
.tag-construction { background: #f4efe4; color: #7a5b2e; }
.tag-rental { background: #e7f2ea; color: #1d6b3a; }
.tag-redeemed { background: #e8eef6; color: #1e4a7a; }
.score {
	font-size: 0.68rem;
	font-weight: 600;
	line-height: 1.2;
	padding: 2px 7px;
	border-radius: 999px;
	white-space: nowrap;
}
.score-green { background: #e7f2ea; color: #1d6b3a; }
.score-yellow { background: #fff4d6; color: #8a5a00; }
.score-red { background: #fde8e8; color: #b42318; }
.metric .score { font-size: 0.75rem; padding: 3px 8px; }
.rental-pending { font-size: 0.95rem; font-weight: 500; color: #888; }
.rent-wrap {
	margin: 0 0 14px;
	padding-bottom: 12px;
	border-bottom: 1px solid #e8e8e8;
}
.rent-wrap h4 { font-size: 0.95rem; font-weight: 600; margin: 0 0 4px; }
.rent-caption { margin: 0 0 8px; font-size: 0.75rem; line-height: 1.35; color: #666; }
.chart-wrap.rent-chart { height: 220px; }
.slot .buys-wrap > summary {
	display: flex;
	align-items: flex-start;
	font-size: 0.95rem;
	font-weight: 600;
	margin: 0 0 8px;
}
.chart-wrap {
	position: relative;
	width: 100%;
	height: 340px;
}
.chart-wrap canvas { display: block; max-width: 100%; cursor: crosshair; }
.zoom-reset {
	position: absolute;
	top: 0;
	right: 0;
	font-size: 0.7rem;
	padding: 2px 8px;
	border: 1px solid #ccc;
	border-radius: 4px;
	background: #fff;
	cursor: pointer;
}
.chart-placeholder { color: #666; font-size: 0.9rem; padding: 20px 8px; text-align: center; }
.slot .eta-wrap { margin-top: 10px; }
.slot .eta-wrap h4 { font-size: 0.85rem; font-weight: 600; margin: 0 0 6px; }
.slot .eta-wrap table { border-collapse: collapse; font-size: 0.75rem; width: 100%; }
.slot .eta-wrap th, .slot .eta-wrap td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
.slot .eta-wrap th { background: #eee; }
.slot .eta-wrap .muted { color: #666; font-size: 0.8rem; }
.slot .holders-wrap { margin-top: 12px; }
.slot .holders-wrap > summary {
	display: flex;
	align-items: center;
	gap: 8px;
	font-size: 0.95rem;
	font-weight: 600;
	margin: 0 0 6px;
}
.holders-count { color: #6b7280; font-weight: 500; }
.holders-toolbar {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	justify-content: space-between;
	gap: 6px 12px;
	margin: 0 0 8px;
}
.holders-toolbar .section-meta { margin: 0; }
.holders-limit {
	display: inline-flex;
	border: 1px solid #d1d5db;
	border-radius: 6px;
	overflow: hidden;
}
.holders-limit button {
	border: 0;
	background: #fff;
	padding: 3px 10px;
	font: inherit;
	font-size: 0.75rem;
	font-weight: 500;
	color: #374151;
	cursor: pointer;
	text-transform: capitalize;
}
.holders-limit button + button { border-left: 1px solid #d1d5db; }
.holders-limit button[aria-pressed="true"] { background: #1f2937; color: #fff; }
.slot .holders-wrap table { border-collapse: collapse; font-size: 0.75rem; width: 100%; }
.slot .holders-wrap th, .slot .holders-wrap td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; vertical-align: top; }
.slot .holders-wrap th { background: #eee; white-space: nowrap; }
.slot .holders-wrap td.num { text-align: right; white-space: nowrap; }
.slot .holders-wrap td.pair .usdt { display: block; color: #666; font-size: 0.92em; }
.slot .holders-wrap td.address { font-family: ui-monospace, monospace; font-size: 0.7rem; }
.slot .holders-wrap td.tier { white-space: nowrap; }
.slot .secondary-meta { font-size: 0.85rem; color: #444; margin: 0 0 8px; }
.slot > .secondary-meta { margin: 12px 0 6px; }
.slot .secondary-wrap { margin-top: 4px; }
.slot .secondary-wrap h4 { font-size: 0.95rem; font-weight: 600; margin: 0 0 8px; }
.slot .tier-wrap { margin: 4px 0 0 14px; }
.tier-row {
	display: grid;
	grid-template-columns: 140px 1fr;
	align-items: center;
	gap: 10px;
	margin-bottom: 6px;
	font-size: 0.8rem;
}
.tier-row-label { color: #444; }
.tier-bar {
	display: flex;
	height: 22px;
	border-radius: 4px;
	overflow: hidden;
	background: #eee;
}
.tier-seg {
	display: flex;
	align-items: center;
	justify-content: center;
	min-width: 2px;
	overflow: hidden;
	white-space: nowrap;
	color: #fff;
	font-size: 0.7rem;
	font-weight: 600;
	text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
}
.tier-seg + .tier-seg { border-left: 1px solid #fff; }
.tier-legend {
	display: flex;
	flex-wrap: wrap;
	gap: 4px 16px;
	list-style: none;
	margin: 8px 0 0 150px;
	padding: 0;
	font-size: 0.75rem;
	color: #444;
}
.tier-swatch {
	display: inline-block;
	width: 10px;
	height: 10px;
	border-radius: 2px;
	margin-right: 6px;
	vertical-align: -1px;
}
.holders-section { margin-top: 28px; }
.holders-section h2 { font-size: 1rem; font-weight: 600; margin: 0 0 8px; }
.exited-holders { margin-top: 12px; }
.exited-holders h4 { font-size: 0.85rem; font-weight: 600; margin: 0 0 6px; }
.tier-layout {
	display: flex;
	flex-wrap: wrap;
	gap: 16px 24px;
	align-items: center;
}
.tier-chart-wrap {
	position: relative;
	height: 300px;
	flex: 1 1 280px;
	max-width: 480px;
}
.tier-chart-wrap canvas { display: block; max-width: 100%; }
.holders-section details.holders-collapse { margin-top: 20px; }
.holders-section details.holders-collapse > summary {
	display: flex;
	align-items: center;
	gap: 8px;
	font-size: 0.9rem;
	font-weight: 600;
	margin: 0 0 8px;
}
.section-meta { font-size: 0.85rem; color: #444; margin: 0 0 10px; }
.holders-scroll { overflow-x: auto; border: 1px solid #e0e0e0; border-radius: 8px; }
.holders-section table { border-collapse: collapse; font-size: 0.8rem; width: 100%; }
.holders-section th, .holders-section td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
.holders-section th { background: #eee; white-space: nowrap; }
.holders-section td.num { text-align: right; white-space: nowrap; }
.holders-section td.pair .usdt { display: block; color: #666; font-size: 0.92em; }
.holders-section td.address { font-family: ui-monospace, monospace; font-size: 0.75rem; }
.holders-section td.properties { min-width: 200px; max-width: 420px; }
.holders-section td.tier { white-space: nowrap; }
td.trend.up { color: #1a7f37; }
td.trend.down { color: #cf222e; }
td.trend.flat { color: #888; }
.off-platform-note { color: #666; font-size: 0.8rem; margin: 8px 0 0; }
</style>
</head>

	const STORAGE_KEY = "lang";

	function storedLang() {
		try {
			return localStorage.getItem(STORAGE_KEY);
		} catch (e) {
			return null;
		}
	}

	// ?lang= wins over the saved choice, which wins over the browser language.
	function detectLang() {
		const candidates = [
			new URLSearchParams(location.search).get("lang"),
			storedLang(),
			(navigator.language || "").slice(0, 2).toLowerCase()
		];
		for (const code of candidates) {
			if (code && I18N[code]) return code;
		}
		return "en";
	}

	const lang = detectLang();
	const pluralRules = new Intl.PluralRules(lang);
	document.documentElement.lang = lang;

	function has(key) {
		return key in I18N[lang] || key in I18N.en;
	}

	// Plural entries are objects keyed by Intl.PluralRules category and pick a form by vars.n.
	function t(key, vars) {
		let msg = key in I18N[lang] ? I18N[lang][key] : I18N.en[key];
		if (msg == null) return key;
		if (typeof msg === "object") {
			msg = msg[pluralRules.select(Number(vars && vars.n))] || msg.other;
		}
		if (!vars) return msg;
		return msg.replace(/\{(\w+)\}/g, function (match, name) {
			return vars[name] != null ? String(vars[name]) : match;
		});
	}

	function applyStatic() {
		document.querySelectorAll("[data-i18n]").forEach(function (el) {
			el.textContent = t(el.dataset.i18n);
		});
		document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
			el.setAttribute("aria-label", t(el.dataset.i18nAria));
		});
	}

	function switchTo(code) {
		try {
			localStorage.setItem(STORAGE_KEY, code);
		} catch (e) {
			// The ?lang= param below still carries the choice for this page.
		}
		const url = new URL(location.href);
		url.searchParams.set("lang", code);
		location.href = url.toString();
	}

	function mountSwitcher() {
		const slot = document.getElementById("lang-switch");
		if (!slot) return;
		slot.setAttribute("role", "group");
		slot.setAttribute("aria-label", t("lang.label"));
		Object.keys(I18N).forEach(function (code) {
			const button = document.createElement("button");
			button.type = "button";
			button.textContent = code.toUpperCase();
			button.setAttribute("aria-pressed", String(code === lang));
			button.addEventListener("click", function () {
				if (code !== lang) switchTo(code);
			});
			slot.appendChild(button);
		});
	}

	applyStatic();
	mountSwitcher();
	window.i18n = { lang: lang, t: t, has: has };
})();
</script>

	// Binaryx matches the EIP-55 form and 404s on a lowercase address.
	const keccakRC = [
		0x0000000000000001n, 0x0000000000008082n, 0x800000000000808an, 0x8000000080008000n,
		0x000000000000808bn, 0x0000000080000001n, 0x8000000080008081n, 0x8000000000008009n,
		0x000000000000008an, 0x0000000000000088n, 0x0000000080008009n, 0x000000008000000an,
		0x000000008000808bn, 0x800000000000008bn, 0x8000000000008089n, 0x8000000000008003n,
		0x8000000000008002n, 0x8000000000000080n, 0x000000000000800an, 0x800000008000000an,
		0x8000000080008081n, 0x8000000000008080n, 0x0000000080000001n, 0x8000000080008008n
	];
	const keccakRot = [
		0, 1, 62, 28, 27,
		36, 44, 6, 55, 20,
		3, 10, 43, 25, 39,
		41, 45, 15, 21, 8,
		18, 2, 61, 56, 14
	];
	const keccakMask = (1n << 64n) - 1n;

	function keccakRotl(x, n) {
		if (n === 0) return x;
		return ((x << BigInt(n)) | (x >> BigInt(64 - n))) & keccakMask;
	}

	function keccakF(a) {
		for (let round = 0; round < 24; round++) {
			const c = new Array(5);
			for (let x = 0; x < 5; x++) c[x] = a[x] ^ a[x + 5] ^ a[x + 10] ^ a[x + 15] ^ a[x + 20];
			for (let x = 0; x < 5; x++) {
				const d = c[(x + 4) % 5] ^ keccakRotl(c[(x + 1) % 5], 1);
				for (let y = 0; y < 25; y += 5) a[x + y] ^= d;
			}
			const b = new Array(25);
			for (let x = 0; x < 5; x++) {
				for (let y = 0; y < 5; y++) {
					b[y + 5 * ((2 * x + 3 * y) % 5)] = keccakRotl(a[x + 5 * y], keccakRot[x + 5 * y]);
				}
			}
			for (let y = 0; y < 5; y++) {
				for (let x = 0; x < 5; x++) {
					const i = x + 5 * y;
					a[i] = (b[i] ^ ((~b[((x + 1) % 5) + 5 * y]) & b[((x + 2) % 5) + 5 * y])) & keccakMask;
				}
			}
			a[0] ^= keccakRC[round];
		}
	}

	function keccak256(text) {
		const rate = 136;
		const bytes = new Uint8Array(text.length);
		for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i);
		const n = Math.ceil((bytes.length + 1) / rate) * rate;
		const padded = new Uint8Array(n);
		padded.set(bytes);
		padded[bytes.length] = 0x01;
		padded[n - 1] |= 0x80;
		const a = new Array(25).fill(0n);
		for (let off = 0; off < n; off += rate) {
			for (let i = 0; i < rate / 8; i++) {
				let lane = 0n;
				for (let b = 0; b < 8; b++) lane |= BigInt(padded[off + i * 8 + b]) << BigInt(8 * b);
				a[i] ^= lane;
			}
			keccakF(a);
		}
		let hex = "";
		for (let i = 0; i < 4; i++) {
			const lane = a[i];
			for (let b = 0; b < 8; b++) hex += Number((lane >> BigInt(8 * b)) & 0xffn).toString(16).padStart(2, "0");
		}
		return hex;
	}

	function checksumAddress(address) {
		const hex = String(address).toLowerCase().replace(/^0x/, "");
		const hash = keccak256(hex);
		let out = "0x";
		for (let i = 0; i < hex.length; i++) {
			out += parseInt(hash[i], 16) >= 8 ? hex[i].toUpperCase() : hex[i];
		}
		return out;
	}

	function amountIsZero(raw) {
		if (raw == null || raw === "") return true;
		const n = Number(String(raw).replace(/^\+/, ""));

	}

	function formatUSDT(raw) {
		if (raw == null || raw === "") return "";
		const s = String(raw);
		const plus = s.charAt(0) === "+";
		let body = plus ? s.slice(1) : s;
		const neg = body.charAt(0) === "-";
		if (neg) body = body.slice(1);
		const dot = body.indexOf(".");
		const whole = dot < 0 ? body : body.slice(0, dot);
		const frac = dot < 0 ? "" : body.slice(dot + 1);
		if (!/^\d+$/.test(whole)) return s;
		const grouped = Number(whole).toLocaleString(window.i18n.lang, { maximumFractionDigits: 0 });
		let out = grouped;
		if (frac) {
			const dec = (1.1).toLocaleString(window.i18n.lang).replace(/\d/g, "");
			out += dec + frac;
		}
		if (neg) return "-" + out;
		if (plus) return "+" + out;
		return out;
	}

	function trendCell(delta, usdt) {
		const tokenFlat = amountIsZero(delta);
		const paid = usdt || "0";
		if (tokenFlat && amountIsZero(paid)) {
			return "<td class=\"num trend flat\">—</td>";
		}
		let cls = "flat";
		let tokenHtml = "—";
		if (!tokenFlat) {
			const down = String(delta).charAt(0) === "-";
			cls = down ? "down" : "up";
			tokenHtml = (down ? "↓ " : "↑ ") + escapeHtml(delta);
		}
		return "<td class=\"num trend pair " + cls + "\">" + tokenHtml +
			"<span class=\"usdt\">" + escapeHtml(formatUSDT(paid)) + " USDT</span></td>";
	}

	function addUSDT(a, b) {
		const scale = 100;
		const sum = Math.round(((Number(a) || 0) + (Number(b) || 0)) * scale);
		const sign = sum < 0 ? "-" : "";
		const abs = Math.abs(sum);
		const whole = Math.trunc(abs / scale);
		const frac = String(abs % scale).padStart(2, "0");
		return sign + whole + "." + frac;
	}

	function amountPair(tokens, usdt, mark) {
		const star = mark ? "*" : "";
		return "<td class=\"num pair\"><span>" + escapeHtml(tokens) +
			"</span><span class=\"usdt\">" + escapeHtml(formatUSDT(usdt)) + " USDT" + star + "</span></td>";
	}

	function amountPairOrDash(tokens, usdt, mark) {
		if (amountIsZero(tokens) && amountIsZero(usdt)) {
			return "<td class=\"num trend flat\">—</td>";
		}
		return amountPair(tokens, usdt, mark);
	}

	function offPlatformNote(rows) {
		const marked = rows.some(function (h) { return h.offPlatformP2P; });
		if (!marked) return "";
		return "<p class=\"off-platform-note\">" + escapeHtml(t("holders.offPlatformP2P")) + "</p>";
	}

	const holderLimitChoices = [10, 25, 50, 0];

	function shownHolders(holders, limit) {
		if (!limit) return holders;
		return holders.slice(0, limit);
	}

	function deltaNumber(v) {
		const n = Number(v);
		return isFinite(n) ? n : 0;
	}

	function splitHolders(holders) {
		const active = [];
		const exited = [];
		holders.forEach(function (h) {
			(deltaNumber(h.balance) === 0 ? exited : active).push(h);
		});
		exited.sort(function (a, b) {
			const week = deltaNumber(a.weekDeltaTokens) - deltaNumber(b.weekDeltaTokens);
			if (week !== 0) return week;
			return deltaNumber(a.monthDeltaTokens) - deltaNumber(b.monthDeltaTokens);
		});
		return { active: active, exited: exited };
	}

	function tierCell(h) {
		if (!h.tier) return "<td class=\"tier\">—</td>";
		return "<td class=\"tier\">" + escapeHtml(t("tier." + h.tier)) + "</td>";
	}

	function holderRow(h, i, withProperties) {
		const names = withProperties
			? "<td class=\"properties\">" + escapeHtml((h.propertyNames || []).join(", ")) + "</td>"
			: "";
		return "<tr>" +
			"<td class=\"num\">" + (i + 1) + "</td>" +
			"<td class=\"address\">" + escapeHtml(h.address) + "</td>" +
			names +
			amountPair(h.balance, addUSDT(h.initSaleUSDT, h.p2pUSDT), h.offPlatformP2P) +
			amountPairOrDash(h.initialBought, h.initSaleUSDT) +
			amountPairOrDash(h.p2pBought, h.p2pUSDT, h.offPlatformP2P) +
			trendCell(h.weekDeltaTokens, h.weekDeltaUSDT) +
			trendCell(h.monthDeltaTokens, h.monthDeltaUSDT) +
			"<td class=\"num\">" + (h.supplyPct != null ? h.supplyPct.toFixed(2) : "0.00") + "%</td>" +
			tierCell(h) +
			"</tr>";
	}

	function holdersTable(rows, columns) {
		return "<div class=\"holders-scroll\"><table><thead><tr>" +
			"<th>#</th>" + columns.map(function (key) {
				return "<th>" + escapeHtml(t(key)) + "</th>";
			}).join("") +
			"</tr></thead><tbody>" + rows + "</tbody></table></div>";
	}

	function dateCell(value) {
		if (!value) return "<td class=\"num\">—</td>";
		return "<td class=\"num\">" + escapeHtml(value) + "</td>";
	}

	function exitedRow(h, i, withProperties) {
		const names = withProperties
			? "<td class=\"properties\">" + escapeHtml((h.propertyNames || []).join(", ")) + "</td>"
			: "";
		return "<tr>" +
			"<td class=\"num\">" + (i + 1) + "</td>" +
			"<td class=\"address\">" + escapeHtml(h.address) + "</td>" +
			names +
			amountPair(addUSDT(h.initialBought, h.p2pBought), addUSDT(h.initSaleUSDT, h.p2pUSDT), h.offPlatformP2P) +
			trendCell(h.weekDeltaTokens, h.weekDeltaUSDT) +
			trendCell(h.monthDeltaTokens, h.monthDeltaUSDT) +
			dateCell(h.entered) +
			dateCell(h.exited) +
			"</tr>";
	}

	function exitedBlock(exited, withProperties) {
		if (exited.length === 0) return "";
		const columns = withProperties ? projectExitedColumns : propertyExitedColumns;
		const rows = exited.map(function (h, i) {
			return exitedRow(h, i, withProperties);
		}).join("");
		return "<div class=\"exited-holders\"><h4>" + escapeHtml(t("holders.exited")) + "</h4>" +
			holdersTable(rows, columns) + "</div>";
	}

	const propertyHolderColumns = ["col.address", "col.balance", "col.initialBought", "col.p2pBought", "col.week", "col.month", "col.supplyPct", "col.tier"];
	const projectHolderColumns = ["col.address", "col.propertyNames", "col.balance", "col.initialBought", "col.p2pBought", "col.week", "col.month", "col.supplyPct", "col.tier"];
	const propertyExitedColumns = ["col.address", "col.invested", "col.week", "col.month", "col.dateIn", "col.dateOut"];
	const projectExitedColumns = ["col.address", "col.propertyNames", "col.invested", "col.week", "col.month", "col.dateIn", "col.dateOut"];

	function holdersLimitControl(selected, onChange) {
		const group = document.createElement("div");
		group.className = "holders-limit";
		group.setAttribute("role", "group");
		group.setAttribute("aria-label", t("holders.limit"));
		holderLimitChoices.forEach(function (n) {
			const button = document.createElement("button");
			button.type = "button";
			button.textContent = n ? String(n) : t("holders.all");
			button.setAttribute("aria-pressed", String(n === selected));
			button.addEventListener("click", function () {
				group.querySelectorAll("button").forEach(function (b) {
					b.setAttribute("aria-pressed", String(b === button));
				});
				onChange(n);
			});
			group.appendChild(button);
		});
		return group;
	}

	function holdersCount(n) {
		const el = document.createElement("span");
		el.className = "holders-count";
		el.textContent = "· " + n;
		return el;
	}

	function renderHolderList(container, split, limit, withProperties) {
		const toolbar = document.createElement("div");
		toolbar.className = "holders-toolbar";
		const meta = document.createElement("p");
		meta.className = "section-meta";
		toolbar.appendChild(meta);
		const list = document.createElement("div");
		container.appendChild(toolbar);
		container.appendChild(list);
		const columns = withProperties ? projectHolderColumns : propertyHolderColumns;
		function paint() {
			const shown = shownHolders(split.active, limit);
			meta.textContent = t("holders.showing", { shown: shown.length, total: split.active.length });
			const rows = shown.map(function (h, i) {
				return holderRow(h, i, withProperties);
			}).join("");
			list.innerHTML = holdersTable(rows, columns) + exitedBlock(split.exited, withProperties) +
				offPlatformNote(shown.concat(split.exited));
		}
		toolbar.appendChild(holdersLimitControl(limit, function (next) {
			limit = next;
			paint();
		}));
		paint();
	}

	function renderPropertyHoldersInto(container, property) {
		const summary = document.createElement("summary");
		container.appendChild(summary);
		const split = splitHolders(property.holders);
		if (split.active.length === 0) {
			summary.textContent = t("holders.none");
			container.insertAdjacentHTML("beforeend", exitedBlock(split.exited, false) + offPlatformNote(split.exited));
			return;
		}
		summary.textContent = t("holders.title");
		summary.appendChild(holdersCount(split.active.length));
		renderHolderList(container, split, propertyHoldersDefault, false);
	}

	function chartOptions() {
		return {
			responsive: true,
			maintainAspectRatio: false,
			interaction: { mode: "index", intersect: false },
			scales: {
				x: { ticks: { maxTicksLimit: 24 } },
				y: {
					type: "linear",
					position: "left",
					beginAtZero: true,
					title: { display: true, text: t("chart.weeklyVolume"), font: { size: 10 } }
				},
				y1: {
					type: "linear",
					position: "right",
					beginAtZero: true,
					grid: { drawOnChartArea: false },
					title: { display: true, text: t("chart.cumulative"), font: { size: 10 } }
				}
			}
		};
	}

	// Drag across the plot area to zoom the x axis to that range; "Reset zoom" restores it.
	const rangeSelectPlugin = {
		id: "rangeSelect",
		afterInit: function (chart) {
			const canvas = chart.canvas;
			const state = chart.$rangeSelect = { start: null, end: null };

			const reset = document.createElement("button");
			reset.type = "button";
			reset.className = "zoom-reset";
			reset.textContent = t("resetZoom");
			reset.hidden = true;
			reset.addEventListener("click", function () {
				chart.options.scales.x.min = undefined;
				chart.options.scales.x.max = undefined;
				reset.hidden = true;
				chart.update();
			});
			canvas.parentElement.appendChild(reset);

			function pointerX(e) {
				return e.clientX - canvas.getBoundingClientRect().left;
			}
			function clampX(x) {
				return Math.min(Math.max(x, chart.chartArea.left), chart.chartArea.right);
			}
			function cancel() {
				state.start = state.end = null;
				chart.draw();
			}

			canvas.addEventListener("pointerdown", function (e) {
				if (e.button !== 0) return;
				const x = pointerX(e);
				if (x < chart.chartArea.left || x > chart.chartArea.right) return;
				e.preventDefault();
				state.start = state.end = x;
				canvas.setPointerCapture(e.pointerId);
			});
			canvas.addEventListener("pointermove", function (e) {
				if (state.start == null) return;
				state.end = clampX(pointerX(e));
				chart.draw();
			});
			canvas.addEventListener("pointerup", function () {
				if (state.start == null) return;
				const from = Math.min(state.start, state.end);
				const to = Math.max(state.start, state.end);
				const lo = chart.scales.x.getValueForPixel(from);
				const hi = chart.scales.x.getValueForPixel(to);
				if (to - from < 5 || hi <= lo) {
					cancel();
					return;
				}
				state.start = state.end = null;
				chart.options.scales.x.min = lo;
				chart.options.scales.x.max = hi;
				reset.hidden = false;
				chart.update();
			});
			canvas.addEventListener("pointercancel", cancel);
		},
		afterDraw: function (chart) {
			const state = chart.$rangeSelect;
			if (!state || state.start == null || state.start === state.end) return;
			const area = chart.chartArea;
			const ctx = chart.ctx;
			ctx.save();
			ctx.fillStyle = "rgba(54, 162, 235, 0.15)";
			ctx.fillRect(Math.min(state.start, state.end), area.top, Math.abs(state.end - state.start), area.bottom - area.top);
			ctx.restore();
		}
	};

	function hasSecondaryVolume(property) {
		return property.p2p_sales.labels.length > 0;
	}

	function mountInitialChart(canvas, initial) {
		new Chart(canvas, {
			type: "line",
			data: {
				labels: initial.labels,
				datasets: [
					{
						label: t("chart.weeklyVolume"),
						data: initial.weekly,
						borderColor: "rgb(75, 192, 192)",
						backgroundColor: "rgba(75, 192, 192, 0.2)",
						tension: 0,
						stepped: "before",
						fill: false,
						yAxisID: "y"
					},
					{
						label: t("chart.cumulative"),
						data: initial.cumulative,
						borderColor: "rgb(255, 99, 132)",
						tension: 0.05,
						fill: false,
						yAxisID: "y1"
					}
				]
			},
			options: chartOptions(),
			plugins: [rangeSelectPlugin]
		});
	}

	function renderSecondaryInto(slot, property) {
		const secondary = property.p2p_sales;
		const meta = document.createElement("p");
		meta.className = "secondary-meta";
		if (!hasSecondaryVolume(property)) {
			meta.innerHTML = escapeHtml(t("secondary.market")) + ": <strong>" + escapeHtml(t("secondary.noTransfers")) + "</strong>";
			slot.appendChild(meta);
			return;
		}
		meta.innerHTML = escapeHtml(t("secondary.txs")) + ": <strong>" + secondary.txCount + "</strong>";

		const wrap = document.createElement("div");
		wrap.className = "secondary-wrap";
		const heading = document.createElement("h4");
		heading.textContent = t("secondary.title");
		wrap.appendChild(heading);
		wrap.appendChild(meta);

		const chartWrap = document.createElement("div");
		chartWrap.className = "chart-wrap";
		const canvas = document.createElement("canvas");
		chartWrap.appendChild(canvas);
		wrap.appendChild(chartWrap);
		slot.appendChild(wrap);

		new Chart(canvas, {
			type: "bar",
			data: {
				labels: secondary.labels,
				datasets: [
					{
						label: t("chart.weeklyVolume"),
						data: secondary.weekly,
						backgroundColor: "rgba(54, 162, 235, 0.45)",
						borderColor: "rgb(54, 162, 235)",
						borderWidth: 1,
						yAxisID: "y"
					},
					{
						type: "line",
						label: t("chart.cumulative"),
						data: secondary.cumulative,
						borderColor: "rgb(255, 159, 64)",
						tension: 0.05,
						fill: false,
						yAxisID: "y1"
					}
				]
			},
			options: chartOptions(),
			plugins: [rangeSelectPlugin]
		});
	}

	function renderHolders() {
		const section = document.getElementById("holders-section");
		if (allHolders.length === 0 || allProperties.length < 2) {
			section.hidden = true;
			return;
		}

		const block = document.getElementById("global-holders-block");
		const split = splitHolders(allHolders);
		block.querySelector("summary").appendChild(holdersCount(split.active.length));
		renderHolderList(block, split, projectHoldersDefault, true);

		renderTierCharts(
			document.getElementById("tier-holders-chart"),
			document.getElementById("tier-supply-chart"),
			allHolders,
			tierStats
		);
	}

	const tierPalette = ["#94a3b8", "#fb923c", "#38bdf8", "#6366f1", "#10b981", "#1e40af"];

	function tierTokenTotals(holders) {
		const totals = {};
		holders.forEach(function (h) {
			const n = Number(h.balance);
			if (!isFinite(n) || n === 0) return;
			totals[h.tier] = (totals[h.tier] || 0) + n;
		});
		return totals;
	}

	function tierSlices(holders, stats, include) {
		const tokens = tierTokenTotals(holders);
		const slices = [];
		stats.forEach(function (s, i) {
			if (!include(s)) return;
			slices.push({
				stat: s,
				tokens: tokens[s.name] || 0,
				color: tierPalette[i % tierPalette.length]
			});
		});
		return slices;
	}

	function tierTooltip(slices) {
		return {
			callbacks: {
				label: function (ctx) {
					return tierDetails(slices[ctx.dataIndex]).map(function (line) { return " " + line; });
				}
			}
		};
	}

	function tierDetails(slice) {
		const s = slice.stat;
		return [
			t("tier.tokens", { v: slice.tokens.toFixed(2) }),
			t("tier.supplyPct", { v: s.supplyPct.toFixed(2) }),
			t("tier.holdersPct", { v: s.holdersPct.toFixed(1) })
		];
	}

	function mountTierPie(canvas, title, values, slices) {
		if (slices.length === 0) {
			canvas.parentElement.innerHTML = "<div class=\"chart-placeholder\">" + escapeHtml(t("tier.noData")) + "</div>";
			return;
		}
		new Chart(canvas, {
			type: "pie",
			data: {
				labels: slices.map(function (s) { return t("tier." + s.stat.name); }),
				datasets: [{
					data: slices.map(values),
					backgroundColor: slices.map(function (s) { return s.color; }),
					borderColor: "#fff",
					borderWidth: 2
				}]
			},
			options: {
				responsive: true,
				maintainAspectRatio: false,
				plugins: {
					title: {
						display: true,
						text: title,
						font: { size: 13, weight: "600" }
					},
					legend: {
						position: "bottom",
						labels: { boxWidth: 12, font: { size: 12 } }
					},
					tooltip: tierTooltip(slices)
				}
			}
		});
	}

	function renderTierCharts(holdersCanvas, supplyCanvas, holders, stats) {
		mountTierPie(
			holdersCanvas,
			t("tier.holdersChart"),
			function (s) { return s.stat.count; },
			tierSlices(holders, stats, function (s) { return s.count > 0; })
		);
		mountTierPie(
			supplyCanvas,
			t("tier.supplyChart"),
			function (s) { return s.stat.supplyPct; },
			tierSlices(holders, stats, function (s) { return s.supplyPct > 0; })
		);
	}

	// Supply segments are scaled to the held total so both bars fill the track.
	function tierBar(labelKey, slices, share) {
		const total = slices.reduce(function (sum, s) { return sum + share(s); }, 0);
		const row = document.createElement("div");
		row.className = "tier-row";
		const label = document.createElement("span");
		label.className = "tier-row-label";
		label.textContent = t(labelKey);
		const bar = document.createElement("div");
		bar.className = "tier-bar";
		bar.setAttribute("aria-label", t(labelKey));
		slices.forEach(function (slice) {
			const pct = total > 0 ? share(slice) / total * 100 : 0;
			const seg = document.createElement("span");
			seg.className = "tier-seg";
			seg.style.width = pct + "%";
			seg.style.background = slice.color;
			seg.title = t("tier." + slice.stat.name) + "\n" + tierDetails(slice).join("\n");
			if (pct >= 8) seg.textContent = Math.round(pct) + "%";
			bar.appendChild(seg);
		});
		row.appendChild(label);
		row.appendChild(bar);
		return row;
	}

	function tierLegend(slices) {
		const list = document.createElement("ul");
		list.className = "tier-legend";
		slices.forEach(function (slice) {
			const item = document.createElement("li");
			const swatch = document.createElement("span");
			swatch.className = "tier-swatch";
			swatch.style.background = slice.color;
			const count = document.createElement("strong");
			count.textContent = slice.stat.count;
			item.appendChild(swatch);
			item.appendChild(document.createTextNode(t("tier." + slice.stat.name) + " "));
			item.appendChild(count);
			list.appendChild(item);
		});
		return list;
	}

	function renderPropertyTiersInto(slot, property) {
		const stats = Array.isArray(property.tierStats) ? property.tierStats : [];
		const slices = tierSlices(property.holders, stats, function (s) { return s.count > 0; });
		if (slices.length === 0) return;
		const wrap = document.createElement("div");
		wrap.className = "tier-wrap";
		wrap.setAttribute("role", "group");
		wrap.setAttribute("aria-label", t("tier.distribution"));
		wrap.appendChild(tierBar("tier.holdersChart", slices, function (s) { return s.stat.count; }));
		wrap.appendChild(tierBar("tier.supplyChart", slices, function (s) { return s.stat.supplyPct; }));
		wrap.appendChild(tierLegend(slices));
		slot.appendChild(wrap);
	}

	function renderCharts() {
		if (allProperties.length === 0) {
			grid.innerHTML = "<p class=\"chart-placeholder\">" + escapeHtml(t("noProperties")) + "</p>";
			return;
		}

		allProperties.forEach(function (property) {
			const initial = property.initial_sales;
			const collapseBuys = hasSecondaryVolume(property);
			const slot = document.createElement("div");
			slot.className = "slot";
			renderPropertyHead(slot, property);
			renderPriceInto(slot, property);
			renderRentalInto(slot, property);
			renderRentInto(slot, property);
			const title = document.createElement(collapseBuys ? "summary" : "h3");
			title.textContent = t("initialSales");

			const chartParent = document.createElement(collapseBuys ? "details" : "div");
			if (collapseBuys) {
				chartParent.className = "buys-wrap";
			}
			chartParent.appendChild(title);

			const wrap = document.createElement("div");
			wrap.className = "chart-wrap";
			const canvas = document.createElement("canvas");
			wrap.appendChild(canvas);
			chartParent.appendChild(wrap);

			const etaWrap = document.createElement("div");
			etaWrap.className = "eta-wrap";
			chartParent.appendChild(etaWrap);
			slot.appendChild(chartParent);

			grid.appendChild(slot);

			if (initial.labels.length === 0) {
				wrap.innerHTML = "<div class=\"chart-placeholder\">" + escapeHtml(t("noSeries")) + "</div>";
				etaWrap.innerHTML = "<h4>" + escapeHtml(t("eta.title")) + "</h4><p class=\"muted\">—</p>";
			} else {
				renderETAsInto(etaWrap, initial);
				if (collapseBuys) {
					chartParent.addEventListener("toggle", function () {
						mountInitialChart(canvas, initial);
					}, { once: true });
				} else {
					mountInitialChart(canvas, initial);
				}
			}

			renderSecondaryInto(slot, property);
			const holdersWrap = document.createElement("details");
			holdersWrap.className = "holders-wrap";
			renderPropertyHoldersInto(holdersWrap, property);
			slot.appendChild(holdersWrap);
			renderPropertyTiersInto(slot, property);
		});
	}

	renderHolders();
	renderCharts();
})();
</script>
