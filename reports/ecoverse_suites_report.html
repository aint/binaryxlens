<script>
(function () {
	const raw = document.getElementById("project-data").textContent;
	let projectData;
	try {
		projectData = JSON.parse(raw);
	} catch (e) {
		document.body.innerHTML = "<p>Invalid JSON in #project-data.</p>";
		return;
	}

	function escapeHtml(s) {
		if (s == null || s === "") return "";
		return String(s)
			.replace(/&/g, "&amp;")
			.replace(/</g, "&lt;")
			.replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;");
	}

	if (projectData.name) {
		document.title = projectData.name;
		document.getElementById("project-title").textContent = projectData.name;
	}

	if (projectData.generatedAt) {
		document.getElementById("report-date").textContent = "Generated " + projectData.generatedAt;
	}

	if (projectData.summary) {
		const s = projectData.summary;
		document.getElementById("project-summary").innerHTML =
			"<p>Properties: <strong>" + s.propertyCount + "</strong></p>" +
			"<p>Total supply: <strong>" + escapeHtml(s.totalSupply) + "</strong></p>" +
			"<p>Bought (cumulative): <strong>" + s.boughtPct.toFixed(2) + "%</strong> (" + escapeHtml(s.bought) + " properties)</p>";
	}

	const allProperties = Array.isArray(projectData.properties) ? projectData.properties : [];
	const allHolders = Array.isArray(projectData.holders) ? projectData.holders : [];
	const tierStats = Array.isArray(projectData.tierStats) ? projectData.tierStats : [];
	const globalHoldersTop = typeof projectData.globalHoldersTop === "number" && projectData.globalHoldersTop > 0
		? projectData.globalHoldersTop
		: allHolders.length;
	const propertyHoldersTop = typeof projectData.propertyHoldersTop === "number" && projectData.propertyHoldersTop > 0
		? projectData.propertyHoldersTop
		: 10;
	const grid = document.getElementById("grid");
	const chartInstances = [];

	function etaDate(row) {
		const date = row && row.date;
		return date && date !== "0001-01-01" ? date : "";
	}

	function renderETAsInto(container, chartData) {
		const rows = chartData.etas;
		if (!rows || rows.length === 0) {
			container.innerHTML = "<h4>ETA</h4><p class=\"muted\">No ETA rows.</p>";
			return;
		}
		const times = rows.map(etaDate).filter(Boolean).sort();
		const showDate = times.length > 0;
		let band = "";
		if (times.length >= 2) {
			band = "<p class=\"muted\">Band: <strong>" + escapeHtml(times[0]) + "</strong> … <strong>" + escapeHtml(times[times.length - 1]) + "</strong></p>";
		}
		const body = rows.map(function (r) {
			let row = "<tr><td>" + escapeHtml(r.window) + "</td><td>" + escapeHtml(r.rate) + "</td><td>" + r.days + "</td>";
			if (showDate) {
				row += "<td>" + escapeHtml(etaDate(r)) + "</td>";
			}
			return row + "</tr>";
		}).join("");
		const heading = showDate ? "<h4>ETA</h4>" : "";
		container.innerHTML =
			heading +
			band +
			"<table><thead><tr><th>Window</th><th>Avg Δ</th><th>Days</th>" + (showDate ? "<th>Date</th>" : "") + "</tr></thead><tbody>" +
			body +
			"</tbody></table>";
	}

	function renderPropertyHoldersInto(container, property) {
		const holders = property && Array.isArray(property.holders) ? property.holders : [];
		const summary = "<summary>Top " + propertyHoldersTop + " holders</summary>";
		if (holders.length === 0) {
			container.innerHTML = summary + "<p class=\"muted\">No holders.</p>";
			return;
		}
		const rows = holders.map(function (h, i) {
			return "<tr>" +
				"<td class=\"num\">" + (i + 1) + "</td>" +
				"<td class=\"address\">" + escapeHtml(h.address) + "</td>" +
				"<td class=\"num\">" + escapeHtml(h.balance) + "</td>" +
				"<td class=\"num\">" + (h.supplyPct != null ? h.supplyPct.toFixed(2) : "0.00") + "%</td>" +
				"<td class=\"tier\">" + escapeHtml(h.tier) + "</td>" +
				"</tr>";
		}).join("");
		container.innerHTML =
			summary +
			"<div class=\"holders-scroll\"><table><thead><tr>" +
			"<th>#</th><th>Address</th><th>Balance</th><th>% supply</th><th>Tier</th>" +
			"</tr></thead><tbody>" + rows + "</tbody></table></div>";
	}

	function chartOptions(dailyLabel, cumLabel) {
		return {
			responsive: true,
			maintainAspectRatio: false,
			interaction: { mode: "index", intersect: false },
			scales: {
				x: { ticks: { maxTicksLimit: 24 } },
				y: {
					type: "linear",
					position: "left",
					beginAtZero: true,
					title: { display: true, text: dailyLabel || "Daily Δ", font: { size: 10 } }
				},
				y1: {
					type: "linear",
					position: "right",
					beginAtZero: true,
					grid: { drawOnChartArea: false },
					title: { display: true, text: cumLabel || "Cumulative", font: { size: 10 } }
				}
			}
		};
	}

	function renderSecondaryInto(slot, property) {
		const secondary = property && property.p2p_sales ? property.p2p_sales : null;
		const txCount = secondary && typeof secondary.txCount === "number" ? secondary.txCount : 0;
		const hasVolume = secondary && secondary.labels && secondary.labels.length > 0;

		const meta = document.createElement("p");
		meta.className = "secondary-meta";
		if (!hasVolume) {
			meta.innerHTML = "Secondary market: <strong>no wallet-to-wallet transfers yet</strong>";
			slot.appendChild(meta);
			return;
		}
		meta.innerHTML = "Secondary txs: <strong>" + txCount + "</strong>";
		slot.appendChild(meta);

		const wrap = document.createElement("div");
		wrap.className = "secondary-wrap";
		const heading = document.createElement("h4");
		heading.textContent = secondary.title || "Weekly secondary volume";
		wrap.appendChild(heading);

		const chartWrap = document.createElement("div");
		chartWrap.className = "chart-wrap";
		const canvas = document.createElement("canvas");
		chartWrap.appendChild(canvas);
		wrap.appendChild(chartWrap);
		slot.appendChild(wrap);

		const ch = new Chart(canvas, {
			type: "bar",
			data: {
				labels: secondary.labels,
				datasets: [
					{
						type: "bar",
						label: "Weekly volume",
						data: secondary.weekly,
						backgroundColor: "rgba(54, 162, 235, 0.45)",
						borderColor: "rgb(54, 162, 235)",
						borderWidth: 1,
						yAxisID: "y"
					},
					{
						type: "line",
						label: "Cumulative",
						data: secondary.cumulative,
						borderColor: "rgb(255, 159, 64)",
						tension: 0.05,
						fill: false,
						yAxisID: "y1"
					}
				]
			},
			options: chartOptions("Weekly volume", "Cumulative")
		});
		chartInstances.push(ch);
	}

	function renderHolders() {
		const section = document.getElementById("holders-section");
		if (allHolders.length === 0) {
			section.hidden = true;
			return;
		}

		const showGlobal = allProperties.length > 1;
		const globalBlock = document.getElementById("global-holders-block");
		globalBlock.hidden = !showGlobal;

		if (showGlobal) {
			const shown = Math.min(globalHoldersTop, allHolders.length);
			document.getElementById("holders-meta").textContent =
				"Showing " + shown + " of " + allHolders.length + " holders (by total balance).";

			const body = document.getElementById("holders-body");
			body.innerHTML = allHolders.slice(0, globalHoldersTop).map(function (h, i) {
				return "<tr>" +
					"<td class=\"num\">" + (i + 1) + "</td>" +
					"<td class=\"address\">" + escapeHtml(h.address) + "</td>" +
					"<td class=\"properties\">" + escapeHtml((h.propertyNames || []).join(", ")) + "</td>" +
					"<td class=\"num\">" + escapeHtml(h.balance) + "</td>" +
					"<td class=\"num\">" + (h.supplyPct != null ? h.supplyPct.toFixed(2) : "0.00") + "%</td>" +
					"<td class=\"tier\">" + escapeHtml(h.tier) + "</td>" +
					"</tr>";
			}).join("");
		}

		const tierBody = document.getElementById("tier-stats-body");
		tierBody.innerHTML = tierStats.map(function (s) {
			return "<tr>" +
				"<td class=\"tier\">" + escapeHtml(s.name) + "</td>" +
				"<td class=\"num\">" + s.count + "</td>" +
				"<td class=\"num\">" + s.holdersPct.toFixed(1) + "%</td>" +
				"<td class=\"num\">" + s.supplyPct.toFixed(2) + "%</td>" +
				"</tr>";
		}).join("");
	}

	function renderCharts() {
		grid.innerHTML = "";

		if (allProperties.length === 0) {
			grid.innerHTML = "<p class=\"chart-placeholder\">No properties loaded</p>";
			return;
		}

		allProperties.forEach(function (property) {
			const initial = property && property.initial_sales ? property.initial_sales : null;
			const slot = document.createElement("div");
			slot.className = "slot";
			const title = document.createElement("h3");
			title.textContent = initial && initial.title ? initial.title : (property && property.name ? property.name : "—");
			slot.appendChild(title);

			const wrap = document.createElement("div");
			wrap.className = "chart-wrap";
			const canvas = document.createElement("canvas");
			wrap.appendChild(canvas);
			slot.appendChild(wrap);

			const etaWrap = document.createElement("div");
			etaWrap.className = "eta-wrap";
			slot.appendChild(etaWrap);

			grid.appendChild(slot);

			const holdersWrap = document.createElement("details");
			holdersWrap.className = "holders-wrap";

			if (!initial || !initial.labels || initial.labels.length === 0) {
				wrap.innerHTML = "<div class=\"chart-placeholder\">No series</div>";
				etaWrap.innerHTML = "<h4>ETA</h4><p class=\"muted\">—</p>";
				renderSecondaryInto(slot, property);
				renderPropertyHoldersInto(holdersWrap, property);
				slot.appendChild(holdersWrap);
				return;
			}

			const ch = new Chart(canvas, {
				type: "line",
				data: {
					labels: initial.labels,
					datasets: [
						{
							label: "Daily Δ",
							data: initial.daily,
							borderColor: "rgb(75, 192, 192)",
							backgroundColor: "rgba(75, 192, 192, 0.2)",
							tension: 0,
							stepped: "before",
							fill: false,
							yAxisID: "y"
						},
						{
							label: "Cumulative",
							data: initial.cumulative,
							borderColor: "rgb(255, 99, 132)",
							tension: 0.05,
							fill: false,
							yAxisID: "y1"
						}
					]
				},
				options: chartOptions("Daily Δ", "Cumulative")
			});
			chartInstances.push(ch);
			renderETAsInto(etaWrap, initial);
			renderSecondaryInto(slot, property);
			renderPropertyHoldersInto(holdersWrap, property);
			slot.appendChild(holdersWrap);
		});
	}

	renderHolders();
	renderCharts();
})();
</script>
</body>
</html>
